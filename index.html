      </div>
      <div className="flex gap-1 border-b border-gray-200">
        {['Jobs','Project Gantt','Team Gantt'].map(t=>(
          <button key={t} onClick={()=>setTab(t)}
            className={`px-4 py-2.5 text-sm font-medium border-b-2 transition-colors -mb-px ${tab===t?'border-blue-600 text-blue-600':'border-transparent text-gray-500 hover:text-gray-700'}`}>{t}</button>
        ))}
      </div>
      {tab==='Jobs'&&<JobsTable />}
      {tab==='Project Gantt'&&<GanttChart />}
      {tab==='Team Gantt'&&<TeamGantt />}
    </div>
  );
}

/* ================================================================
   TEAM GANTT — ACTIVE MEMBERS ONLY (used in Planning → Team Gantt tab)
   ================================================================ */
function TeamGanttActive({ activeTeam }) {
  const { items: jobs }        = useRTDB('jobs');
  const { items: leaves }      = useRTDB('leaves');
  const { items: ganttBlocks } = useRTDB('ganttBlocks');
  const [monthOffset, setMonthOffset]   = useState(0);
  const [draggingJobId, setDraggingJobId] = useState(null);
  const [blockModal, setBlockModal]       = useState(null);
  const [pendingDrag, setPendingDrag]     = useState(null);
  const dragInfoRef = useRef(null);

  const NUM_MONTHS = 4;
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const now = new Date();
  const baseDate = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);

  const monthSlots = Array.from({length: NUM_MONTHS}, (_, i) => {
    const d = new Date(baseDate.getFullYear(), baseDate.getMonth() + i, 1);
    const yr = d.getFullYear();
    const mo = d.getMonth();
    const dim = new Date(yr, mo + 1, 0).getDate();
    return { year: yr, month: mo, days: Array.from({length: dim}, (_, j) => j + 1) };
  });

  const firstSlot = monthSlots[0];
  const lastSlot  = monthSlots[NUM_MONTHS - 1];

  const jobsWithDates = jobs.filter(j => j.planningStart && j.planningEnd);

  const clientColorMap = useMemo(() => {
    const clients = [...new Set(jobsWithDates.map(j => j.client))];
    const map = {};
    clients.forEach((c,i) => { map[c] = PROJECT_COLORS[i % PROJECT_COLORS.length]; });
    return map;
  }, [jobsWithDates]);

  const inRange = (start, end, yr, mo, day) => {
    const d = new Date(yr, mo, day);
    const s = new Date(start); s.setHours(0,0,0,0);
    const e = new Date(end);   e.setHours(23,59,59,999);
    return d >= s && d <= e;
  };

  const todayObj = new Date();
  const isToday   = (yr, mo, day) => todayObj.getFullYear()===yr && todayObj.getMonth()===mo && todayObj.getDate()===day;
  const isWeekend = (yr, mo, day) => [0,6].includes(new Date(yr, mo, day).getDay());

  const isOnLeave = (memberName, yr, mo, day) => {
    const d = new Date(yr, mo, day);
    return leaves.filter(l => l.member === memberName && l.start && l.end)
      .some(l => d >= new Date(l.start) && d <= new Date(l.end));
  };

  const addDaysStr = (dateStr, n) => {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  };

  const dateDeltaDays = (fromStr, toStr) => {
    return Math.round((new Date(toStr) - new Date(fromStr)) / 86400000);
  };

  const handleJobDragStart = (e, job, dateStr, type = 'move') => {
    dragInfoRef.current = { jobId: job.id, originDateStr: dateStr, type };
    setDraggingJobId(job.id);
    e.dataTransfer.effectAllowed = 'move';
  };

  const handleJobDragEnd = () => {
    setDraggingJobId(null);
    dragInfoRef.current = null;
  };

  const handleDropOnCell = (e, member, targetDateStr) => {
    e.preventDefault();
    const di = dragInfoRef.current;
    if (!di) return;
    const job = jobsWithDates.find(j => j.id === di.jobId);
    dragInfoRef.current = null;
    setDraggingJobId(null);
    if (!job || !(job.workers||[]).includes(member.name)) return;
    let newStart = job.planningStart;
    let newEnd   = job.planningEnd;
    if (di.type === 'resize-end') {
      if (targetDateStr <= job.planningStart) return;
      newEnd = targetDateStr;
    } else if (di.type === 'resize-start') {
      if (targetDateStr >= job.planningEnd) return;
      newStart = targetDateStr;
    } else {
      const delta = dateDeltaDays(di.originDateStr, targetDateStr);
      if (delta === 0) return;
      newStart = addDaysStr(job.planningStart, delta);
      newEnd   = addDaysStr(job.planningEnd, delta);
    }
    const conflicts = checkLeaveConflicts(job.workers, newStart, newEnd, leaves);
    if (conflicts.length > 0) {
      setPendingDrag({ job, newStart, newEnd, conflicts });
    } else {
      dbUpdate('jobs', job.id, { planningStart: newStart, planningEnd: newEnd });
    }
  };

  const openAddBlock = (member) => {
    const dateStr = new Date().toISOString().slice(0,10);
    setBlockModal({ mode:'add', member: member.name, start: dateStr, end: dateStr, label: '', color: GANTT_BLOCK_COLORS[0] });
  };

  const saveBlock = () => {
    if (!blockModal.label.trim() || !blockModal.start || !blockModal.end) return;
    const conflicts = checkLeaveConflicts([blockModal.member], blockModal.start, blockModal.end, leaves);
    if (!confirmLeaveConflicts(conflicts)) return;
    if (blockModal.mode === 'edit') {
      dbUpdate('ganttBlocks', blockModal.id, { member: blockModal.member, start: blockModal.start, end: blockModal.end, label: blockModal.label, color: blockModal.color });
    } else {
      const id = `gb${Date.now()}`;
      dbSet('ganttBlocks', id, { id, member: blockModal.member, start: blockModal.start, end: blockModal.end, label: blockModal.label, color: blockModal.color });
    }
    setBlockModal(null);
  };

  if (activeTeam.length === 0) return (
    <div className="text-center py-12 bg-white rounded-xl border border-gray-100">
      <p className="text-gray-400">No active members. Go to <strong>Settings</strong> to mark members as active.</p>
    </div>
  );

  return (
    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">

      {/* Navigation — shows range of 4 months */}
      <div className="flex items-center justify-between px-4 py-3 border-b bg-gray-50">
        <button onClick={()=>setMonthOffset(o=>o-1)} className="px-3 py-1.5 text-sm rounded-lg hover:bg-gray-200">← Prev</button>
        <span className="font-semibold text-gray-800">
          {MONTHS[firstSlot.month]} {firstSlot.year} &mdash; {MONTHS[lastSlot.month]} {lastSlot.year}
        </span>
        <button onClick={()=>setMonthOffset(o=>o+1)} className="px-3 py-1.5 text-sm rounded-lg hover:bg-gray-200">Next →</button>
      </div>

      {/* One section per month */}
      {monthSlots.map(({ year: yr, month: mo, days }) => (
        <div key={`${yr}-${mo}`} className="border-b last:border-0">
          {/* Month label */}
          <div className="px-4 py-1.5 bg-indigo-50 border-b border-indigo-100 flex items-center gap-2">
            <span className="text-xs font-bold text-indigo-600 uppercase tracking-wide">{MONTHS[mo]} {yr}</span>
          </div>

          <div className="overflow-x-auto">
            <div style={{minWidth: Math.max(900, days.length*34+220)+'px'}}>

              {/* Day header */}
              <div className="flex border-b bg-gray-50">
                <div className="w-52 shrink-0 border-r px-3 py-2 text-xs font-semibold text-gray-500 uppercase tracking-wide">Member</div>
                {days.map(d => (
                  <div key={d} style={{minWidth:34}} className={`flex-1 text-center border-r last:border-0 py-1.5 ${isToday(yr,mo,d)?'bg-blue-50':isWeekend(yr,mo,d)?'bg-gray-50/60':''}`}>
                    <div className={`text-xs font-semibold ${isToday(yr,mo,d)?'text-blue-600':isWeekend(yr,mo,d)?'text-gray-300':'text-gray-400'}`}>{d}</div>
                    <div className="text-gray-300 text-xs">{['S','M','T','W','T','F','S'][new Date(yr,mo,d).getDay()]}</div>
                  </div>
                ))}
              </div>

              {/* Member rows */}
              {activeTeam.map(member => {
                const mJobs   = jobsWithDates.filter(j => (j.workers||[]).includes(member.name));
                const mBlocks = ganttBlocks.filter(b => b.member === member.name);
                return (
                  <div key={member.id} className="flex border-b last:border-0 hover:bg-blue-50/20 group" style={{minHeight:44}}>
                    <div className="w-52 shrink-0 border-r px-3 flex items-center gap-2">
                      <div className="w-7 h-7 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0"
                        style={{background: member.color}}>
                        {member.initials}
                      </div>
                      <span className="text-sm font-medium text-gray-700 truncate flex-1">{member.name}</span>
                      <button
                        onClick={() => openAddBlock(member)}
                        title="Add manual block"
                        className="opacity-0 group-hover:opacity-100 transition-opacity w-5 h-5 rounded-full bg-gray-200 hover:bg-blue-500 hover:text-white text-gray-600 text-xs flex items-center justify-center shrink-0">
                        +
                      </button>
                    </div>
                    <div className="flex flex-1">
                      {days.map(d => {
                        const wknd    = isWeekend(yr, mo, d);
                        const dateStr = `${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        const active  = wknd ? [] : mJobs.filter(j => inRange(j.planningStart, j.planningEnd, yr, mo, d));
                        const blocks  = wknd ? [] : mBlocks.filter(b => b.start && b.end && inRange(b.start, b.end, yr, mo, d));
                        const onLeave = !wknd && isOnLeave(member.name, yr, mo, d);
                        return (
                          <div key={d} style={{minWidth:34}}
                            onDragOver={e => e.preventDefault()}
                            onDrop={e => handleDropOnCell(e, member, dateStr)}
                            className={`flex-1 border-r last:border-0 flex flex-col gap-0.5 py-1 px-0.5 ${isToday(yr,mo,d)?'bg-blue-50/60':wknd?'bg-gray-50':''}`}>
                            {onLeave && (
                              <div title="On leave"
                                className="h-5 rounded text-[9px] font-semibold flex items-center px-1 overflow-hidden cursor-default select-none text-orange-700"
                                style={{background:'#fed7aa'}}>
                                🏖
                              </div>
                            )}
                            {!onLeave && active.map(j => {
                              const isFirstCell = dateStr === j.planningStart;
                              const isLastCell  = dateStr === j.planningEnd;
                              const color = clientColorMap[j.client]||'#3b82f6';
                              const faded = draggingJobId === j.id;
                              return (
                                <div key={j.id} className="relative h-5 select-none" style={{opacity: faded ? 0.4 : 1}}>
                                  {/* Left resize handle — move start date */}
                                  {isFirstCell && (
                                    <div draggable
                                      onDragStart={e => { e.stopPropagation(); handleJobDragStart(e, j, dateStr, 'resize-start'); }}
                                      onDragEnd={handleJobDragEnd}
                                      title="Drag to change start date"
                                      className="absolute left-0 top-0 bottom-0 w-2 z-10 cursor-col-resize rounded-l"
                                      style={{background:'rgba(0,0,0,0.28)'}} />
                                  )}
                                  {/* Main bar — move entire job */}
                                  <div draggable
                                    onDragStart={e => handleJobDragStart(e, j, dateStr, 'move')}
                                    onDragEnd={handleJobDragEnd}
                                    title={`${j.client}${j.numDays?' — '+j.numDays+(j.effortUnit==='hours'?'h':'d'):''}\n${j.planningStart} → ${j.planningEnd}\nDrag centre to move · drag edges to resize`}
                                    className="absolute inset-0 rounded flex items-center overflow-hidden cursor-grab active:cursor-grabbing"
                                    style={{background: color, paddingLeft: isFirstCell?8:2, paddingRight: isLastCell?8:2}}>
                                    <span className="text-white text-[9px] font-semibold overflow-hidden whitespace-nowrap">
                                      {isFirstCell ? (j.client.length>5?j.client.slice(0,5)+'…':j.client) : ''}
                                    </span>
                                  </div>
                                  {/* Right resize handle — move end date */}
                                  {isLastCell && (
                                    <div draggable
                                      onDragStart={e => { e.stopPropagation(); handleJobDragStart(e, j, dateStr, 'resize-end'); }}
                                      onDragEnd={handleJobDragEnd}
                                      title="Drag to change end date"
                                      className="absolute right-0 top-0 bottom-0 w-2 z-10 cursor-col-resize rounded-r"
                                      style={{background:'rgba(0,0,0,0.28)'}} />
                                  )}
                                </div>
                              );
                            })}
                            {blocks.map(b => (
                              <div key={b.id}
                                title={b.label}
                                onClick={() => setBlockModal({mode:'edit', id:b.id, member:b.member, start:b.start, end:b.end, label:b.label, color:b.color})}
                                className="h-5 rounded text-white text-[9px] font-semibold flex items-center px-1 overflow-hidden cursor-pointer select-none"
                                style={{background: b.color||'#6366f1', opacity:0.85, outline:'1.5px dashed rgba(255,255,255,0.6)', outlineOffset:'-1px'}}>
                                {(b.label||'').length>6?(b.label||'').slice(0,6)+'…':(b.label||'')}
                              </div>
                            ))}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      ))}

      {/* Legend */}
      {Object.keys(clientColorMap).length > 0 && (
        <div className="px-4 py-2 border-t bg-gray-50">
          <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Projects</p>
          <div className="flex flex-wrap gap-3">
            {Object.entries(clientColorMap).map(([client,color]) => (
              <span key={client} className="flex items-center gap-1.5 text-xs text-gray-600">
                <span className="inline-block w-3 h-3 rounded" style={{background:color}}/>{client}
              </span>
            ))}
          </div>
        </div>
      )}
      <div className="px-4 py-2 border-t bg-gray-50">
        <p className="text-xs text-gray-400">💡 Drag the <strong>centre</strong> of a bar to move the whole engagement · Drag the <strong>dark edges</strong> to resize start or end · Hover a member row and click <strong>+</strong> to add a manual block · Click a block to edit or delete</p>
      </div>

      {blockModal && (
        <Modal title={blockModal.mode==='add'?'Add manual block':'Edit block'} onClose={()=>setBlockModal(null)}>
          <div className="space-y-4">
            <div>
              <label className="text-sm font-medium text-gray-700">Member</label>
              <p className="mt-0.5 text-sm text-gray-500">{blockModal.member}</p>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700">Label</label>
              <input className={inp+' mt-1'} placeholder="e.g. Training, Internal work, Admin…"
                value={blockModal.label}
                onChange={e => setBlockModal(b => ({...b, label: e.target.value}))} />
            </div>
            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="text-sm font-medium text-gray-700">Start date</label>
                <input type="date" className={inp+' mt-1'} value={blockModal.start}
                  onChange={e => setBlockModal(b => ({...b, start: e.target.value}))} />
              </div>
              <div>
                <label className="text-sm font-medium text-gray-700">End date</label>
                <input type="date" className={inp+' mt-1'} value={blockModal.end}
                  onChange={e => setBlockModal(b => ({...b, end: e.target.value}))} />
              </div>
            </div>
            <div>
              <label className="text-sm font-medium text-gray-700 block mb-2">Color</label>
              <div className="flex gap-2">
                {GANTT_BLOCK_COLORS.map(c => (
                  <button key={c} type="button"
                    onClick={() => setBlockModal(b => ({...b, color: c}))}
                    className="w-7 h-7 rounded-full transition-transform hover:scale-110"
                    style={{background:c, boxShadow: blockModal.color===c ? `0 0 0 3px white, 0 0 0 5px ${c}` : 'none'}} />
                ))}
              </div>
            </div>
            <div className="flex gap-2 pt-2">
              {blockModal.mode==='edit' && (
                <button onClick={() => { if(window.confirm('Delete this block?')) { dbDelete('ganttBlocks', blockModal.id); setBlockModal(null); } }}
                  className="px-3 py-1.5 text-sm rounded-lg text-red-600 hover:bg-red-50 border border-red-200">
                  Delete
                </button>
              )}
              <div className="flex gap-2 ml-auto">
                <button onClick={() => setBlockModal(null)} className="px-3 py-1.5 text-sm rounded-lg border border-gray-200 hover:bg-gray-50">Cancel</button>
                <button onClick={saveBlock} className="px-4 py-1.5 text-sm rounded-lg bg-blue-600 text-white hover:bg-blue-700">
                  {blockModal.mode==='add'?'Add block':'Save'}
                </button>
              </div>
            </div>
          </div>
        </Modal>
      )}

      {pendingDrag && (
        <Modal title="⚠️ Leave conflict" onClose={() => setPendingDrag(null)}>
          <div className="space-y-3">
            <p className="text-sm text-gray-600">The following team members are on leave during this period:</p>
            <div className="space-y-2">
              {pendingDrag.conflicts.map((c,i) => (
                <div key={i} className="flex items-center gap-3 bg-orange-50 rounded-xl px-3 py-2.5">
                  <span className="text-xl">🏖</span>
                  <div>
                    <p className="text-sm font-semibold">{c.worker}</p>
                    <p className="text-xs text-gray-500">{c.start} → {c.end} · {c.type}</p>
                  </div>
                </div>
              ))}
            </div>
            <p className="text-sm text-gray-500">Do you still want to plan them during this period?</p>
            <div className="flex gap-2 justify-end pt-2">
              <button onClick={() => setPendingDrag(null)} className="px-4 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50">Cancel</button>
              <button onClick={() => { dbUpdate('jobs', pendingDrag.job.id, { planningStart: pendingDrag.newStart, planningEnd: pendingDrag.newEnd }); setPendingDrag(null); }}
                className="px-4 py-2 text-sm rounded-lg bg-orange-500 text-white hover:bg-orange-600 font-medium">
                Plan anyway
              </button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================================================================
   PLANNING — ALLOCATION PAGE
   ================================================================ */
function UnallocatedJobs({ activeTeam }) {
  const { items: jobs }   = useRTDB('jobs');
  const { items: leaves } = useRTDB('leaves');
  const [forms, setForms] = useState({});

  const unallocated = jobs.filter(j =>
    !j.workers?.length || !j.planningStart || !j.planningEnd
  );

  const getForm = id => forms[id] || { workers: [], planningStart: '', planningEnd: '' };
  const setForm = (id, data) => setForms(prev => ({ ...prev, [id]: { ...getForm(id), ...data } }));

  const toggleWorker = (jobId, member) => {
    const curr = getForm(jobId).workers;
    setForm(jobId, {
      workers: curr.includes(member) ? curr.filter(w => w !== member) : [...curr, member]
    });
  };

  const allocate = job => {
    const f = getForm(job.id);
    if (!f.workers.length)            { alert('Select at least one team member'); return; }
    if (!f.planningStart || !f.planningEnd) { alert('Set planning start and end dates'); return; }
    const conflicts = checkLeaveConflicts(f.workers, f.planningStart, f.planningEnd, leaves);
    if (!confirmLeaveConflicts(conflicts)) return;
    dbUpdate('jobs', job.id, {
      workers: f.workers,
      planningStart: f.planningStart,
      planningEnd:   f.planningEnd,
    });
    setForms(prev => { const n={...prev}; delete n[job.id]; return n; });
  };

  if (unallocated.length === 0) return (
    <div className="flex flex-col items-center justify-center py-20 text-center">
      <div className="text-5xl mb-4">✅</div>
      <p className="text-lg font-semibold text-gray-700">All projects are allocated!</p>
      <p className="text-sm text-gray-400 mt-1">Every job has people and dates assigned.</p>
    </div>
  );

  return (
    <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
      {unallocated.map(job => {
        const f = getForm(job.id);
        const canAllocate = f.workers.length > 0 && f.planningStart && f.planningEnd;
        return (
          <div key={job.id} className="bg-white rounded-xl border border-gray-200 shadow-sm p-4 space-y-4 flex flex-col">
            {/* Header */}
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <h3 className="font-semibold text-gray-900 truncate">{job.client}</h3>
                <p className="text-xs text-gray-400 mt-0.5 line-clamp-2">{job.methodology || job.scope || '—'}</p>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <span className={`inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold ${job.type==='Valuation'?'bg-blue-50 text-blue-700':job.type==='IA Review'?'bg-violet-50 text-violet-700':'bg-amber-50 text-amber-700'}`}>
                  {job.type}
                </span>
                <button
                  onClick={() => { if(window.confirm(`Delete "${job.client}" permanently?`)) dbDelete('jobs', job.id); }}
                  title="Delete project"
                  className="w-6 h-6 flex items-center justify-center rounded-full text-gray-300 hover:text-red-500 hover:bg-red-50 transition-colors text-sm">
                  ✕
                </button>
              </div>
            </div>

            {/* Meta */}
            <div className="flex flex-wrap gap-3 text-xs text-gray-500">
              {job.assets  && <span>🗂 {job.assets} assets</span>}
              {job.numDays && <span>⏱ {job.numDays} days</span>}
              {job.signOff && <span>🎯 Sign-off {job.signOff.slice(5)}</span>}
            </div>

            {/* Status chip */}
            {job.workers?.length > 0 && !job.planningStart && (
              <p className="text-xs text-amber-600 bg-amber-50 rounded-lg px-2 py-1">
                ⚠️ Has workers but no dates: {job.workers.join(', ')}
              </p>
            )}
            {!job.workers?.length && (
              <p className="text-xs text-gray-400 bg-gray-50 rounded-lg px-2 py-1">No one assigned yet</p>
            )}

            {/* Team member buttons */}
            <div className="flex-1">
              <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Assign to</p>
              <div className="flex flex-wrap gap-2">
                {activeTeam.map(m => {
                  const hasLeave = f.planningStart && f.planningEnd &&
                    checkLeaveConflicts([m.name], f.planningStart, f.planningEnd, leaves).length > 0;
                  const selected = f.workers.includes(m.name);
                  return (
                  <button key={m.name} onClick={() => toggleWorker(job.id, m.name)}
                    className={`flex-1 min-w-[80px] py-2 rounded-xl text-xs font-semibold border-2 transition-all ${selected
                      ? 'border-transparent text-white shadow-sm'
                      : hasLeave
                        ? 'border-orange-300 bg-orange-50 text-gray-500 hover:border-orange-400'
                        : 'border-gray-200 text-gray-500 hover:border-gray-300 bg-white'}`}
                    style={selected ? {background: m.color} : {}}>
                    <span className="w-6 h-6 rounded-full flex items-center justify-center text-white text-xs font-bold mx-auto mb-1"
                      style={{background: selected ? 'rgba(255,255,255,0.3)' : m.color}}>
                      {m.initials}
                    </span>
                    {m.name}
                    {hasLeave && <span className="block text-[9px] text-orange-500 mt-0.5">🏖 on leave</span>}
                  </button>
                  );
                })}
              </div>
              {activeTeam.length === 0 && (
                <p className="text-xs text-gray-400 italic">No active members — set them in Settings.</p>
              )}
            </div>

            {/* Dates */}
            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="text-xs font-medium text-gray-600">Start date</label>
                <input type="date" value={f.planningStart}
                  onChange={e => setForm(job.id, {planningStart: e.target.value})}
                  className="w-full mt-1 rounded-lg border border-gray-300 px-2 py-1.5 text-xs focus:border-blue-500 focus:outline-none" />
              </div>
              <div>
                <label className="text-xs font-medium text-gray-600">End date</label>
                <input type="date" value={f.planningEnd}
                  onChange={e => setForm(job.id, {planningEnd: e.target.value})}
                  className="w-full mt-1 rounded-lg border border-gray-300 px-2 py-1.5 text-xs focus:border-blue-500 focus:outline-none" />
              </div>
            </div>

            {/* Allocate button */}
            <button onClick={() => allocate(job)}
              disabled={!canAllocate}
              className={`w-full py-2.5 rounded-xl text-sm font-semibold transition-all ${canAllocate
                ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-sm'
                : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>
              {canAllocate ? 'Allocate ✓' : 'Complete all fields'}
            </button>
          </div>
        );
      })}
    </div>
  );
}

function TeamCalendar({ activeTeam }) {
  const { items: jobs }   = useRTDB('jobs');
  const { items: leaves } = useRTDB('leaves');
  const [monthOffset, setMonthOffset] = useState(new Date().getMonth());

  const base = new Date(2026, monthOffset, 1);
  const year  = base.getFullYear();
  const month = base.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const days = Array.from({length:daysInMonth},(_,i)=>i+1);
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const jobsWithDates = jobs.filter(j => j.planningStart && j.planningEnd);

  const clientColorMap = useMemo(() => {
    const clients = [...new Set(jobsWithDates.map(j => j.client))];
    const map = {};
    clients.forEach((c,i) => { map[c] = PROJECT_COLORS[i % PROJECT_COLORS.length]; });
    return map;
  }, [jobsWithDates]);

  const inRange = (job, day) => {
    const d = new Date(year, month, day);
    const s = new Date(job.planningStart); s.setHours(0,0,0,0);
    const e = new Date(job.planningEnd);   e.setHours(23,59,59,999);
    return d >= s && d <= e;
  };

  const isToday = day => {
    const t = new Date();
    return t.getFullYear()===year && t.getMonth()===month && t.getDate()===day;
  };

  const isWeekend = day => [0,6].includes(new Date(year, month, day).getDay());

  const memberJobs = memberName => jobsWithDates.filter(j => (j.workers||[]).includes(memberName));

  const memberLeaves = memberName => leaves.filter(l => l.member === memberName && l.start && l.end);
  const isOnLeave = (memberName, day) => {
    const d = new Date(year, month, day);
    return memberLeaves(memberName).some(l => {
      const s = new Date(l.start); s.setHours(0,0,0,0);
      const e = new Date(l.end);   e.setHours(23,59,59,999);
      return d >= s && d <= e;
    });
  };

  return (
    <div className="space-y-4">
      {activeTeam.length === 0 && (
        <div className="text-center py-12 bg-white rounded-xl border border-gray-100">
          <p className="text-gray-400">No active members. Go to <strong>Settings</strong> to mark members as active.</p>
        </div>
      )}

      {/* Month navigator */}
      <div className="flex items-center justify-between bg-white rounded-xl border border-gray-200 px-4 py-3">
        <button onClick={()=>setMonthOffset(o=>o-1)} className="px-3 py-1.5 text-sm rounded-lg hover:bg-gray-100">← Prev</button>
        <span className="font-semibold text-gray-800">{MONTHS[month]} {year}</span>
        <button onClick={()=>setMonthOffset(o=>o+1)} className="px-3 py-1.5 text-sm rounded-lg hover:bg-gray-100">Next →</button>
      </div>

      {/* One card per active team member */}
      {activeTeam.map(member => {
        const mJobs = memberJobs(member.name);
        return (
          <div key={member.id} className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            {/* Member header */}
            <div className="flex items-center gap-3 px-4 py-3 border-b" style={{borderLeftWidth:4, borderLeftColor: member.color}}>
              <div className="w-8 h-8 rounded-full flex items-center justify-center text-white text-sm font-bold"
                style={{background: member.color}}>
                {member.initials}
              </div>
              <div>
                <p className="font-semibold text-gray-800">{member.name}</p>
                <p className="text-xs text-gray-400">
                  {mJobs.length === 0 ? 'No projects this month' : `${mJobs.length} project${mJobs.length>1?'s':''} this month`}
                  {memberLeaves(member.name).some(l => {
                    const s=new Date(l.start),e=new Date(l.end);
                    return s<=new Date(year,month+1,0)&&e>=new Date(year,month,1);
                  }) && <span className="ml-2 text-orange-500">· 🏖 On leave this month</span>}
                </p>
              </div>
            </div>

            {/* Calendar row */}
            <div className="overflow-x-auto">
              <div style={{minWidth: Math.max(700, daysInMonth*36+16)+'px'}}>
                {/* Day numbers */}
                <div className="flex px-2 pt-2 pb-1">
                  {days.map(d => (
                    <div key={d} style={{minWidth:36}} className={`flex-1 text-center text-xs pb-1 ${isToday(d)?'font-bold text-blue-600':isWeekend(d)?'text-gray-300':'text-gray-400'}`}>
                      <div>{d}</div>
                      <div className="text-gray-300">{['S','M','T','W','T','F','S'][new Date(year,month,d).getDay()]}</div>
                    </div>
                  ))}
                </div>

                {/* Bars */}
                <div className="flex px-2 pb-3 gap-0" style={{minHeight: (Math.max(mJobs.length,1)*28+8)+'px'}}>
                  {days.map(d => {
                    const activeJobs = isWeekend(d) ? [] : mJobs.filter(j => inRange(j, d));
                    const onLeave    = !isWeekend(d) && isOnLeave(member.name, d);
                    return (
                      <div key={d} style={{minWidth:36}}
                        className={`flex-1 flex flex-col gap-0.5 py-1 px-0.5 rounded ${isToday(d)?'bg-blue-50':isWeekend(d)?'bg-gray-50':''}`}>
                        {onLeave && (
                          <div title="On leave"
                            className="h-5 rounded text-[9px] font-semibold flex items-center px-1 overflow-hidden cursor-default select-none text-orange-700"
                            style={{background:'#fed7aa'}}>
                            🏖 Leave
                          </div>
                        )}
                        {!onLeave && activeJobs.length === 0 && mJobs.length === 0 && (
                          <div className="flex-1 flex items-center justify-center">
                            <span className="text-xs text-gray-200">·</span>
                          </div>
                        )}
                        {activeJobs.map(j => (
                          <div key={j.id}
                            title={`${j.client}\n${j.planningStart} → ${j.planningEnd}${j.numDays?' ('+j.numDays+(j.effortUnit==='hours'?'h':'d')+')':''}`}
                            className="h-5 rounded text-white text-[9px] font-semibold flex items-center px-1 overflow-hidden cursor-default select-none"
                            style={{background: clientColorMap[j.client]||'#3b82f6'}}>
                            {j.client.slice(0,5)}
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Active projects list */}
            {mJobs.length > 0 && (
              <div className="border-t px-4 py-2 flex flex-wrap gap-2">
                {mJobs.map(j => (
                  <span key={j.id} className="inline-flex items-center gap-1.5 text-xs text-white rounded-full px-2.5 py-1"
                    style={{background: clientColorMap[j.client]||'#3b82f6'}}>
                    {j.client}
                    {j.numDays && <span className="opacity-75">· {j.numDays}d</span>}
                  </span>
                ))}
              </div>
            )}
          </div>
        );
      })}  {/* end activeTeam.map */}

      {/* Client legend */}
      {Object.keys(clientColorMap).length > 0 && (
        <div className="bg-white rounded-xl border border-gray-100 px-4 py-3">
          <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">All projects</p>
          <div className="flex flex-wrap gap-3">
            {Object.entries(clientColorMap).map(([client,color]) => (
              <span key={client} className="flex items-center gap-1.5 text-xs text-gray-600">
                <span className="inline-block w-3 h-3 rounded" style={{background:color}}/>{client}
              </span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

const LEAVE_TYPES = ['Holiday','Sick','Personal','Other'];

function LeavesTab({ activeTeam }) {
  const { items: leaves } = useRTDB('leaves');
  const [modal, setModal] = useState(null);
  const [form,  setForm]  = useState({});

  const today   = useMemo(() => { const d=new Date(); d.setHours(0,0,0,0); return d; }, []);
  const win2M   = useMemo(() => { const d=new Date(today); d.setDate(d.getDate()+60); return d; }, [today]);
  const sorted  = [...leaves].sort((a,b) => a.start > b.start ? 1 : -1);
  const upcoming = sorted.filter(l => l.end && new Date(l.end) >= today && l.start && new Date(l.start) <= win2M);

  const leaveDays = (l) => {
    if (!l.start || !l.end) return '—';
    return Math.round((new Date(l.end) - new Date(l.start)) / 86400000) + 1 + 'd';
  };

  const openAdd = () => { setForm({ member: activeTeam[0]?.name||'', start:'', end:'', type:'Holiday', notes:'' }); setModal('add'); };
  const save = () => {
    const item = { ...form };
    if (modal==='add') { const id=`l${Date.now()}`; dbSet('leaves',id,{id,...item}); }
    else { dbUpdate('leaves', modal.id, item); }
    setModal(null);
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <p className="text-sm text-gray-500">Absences appear automatically in the Calendar and Team Gantt.</p>
        <button onClick={openAdd} className="px-3 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 font-medium">+ Add leave</button>
      </div>

      {upcoming.length > 0 && (
        <div className="bg-orange-50 border border-orange-200 rounded-xl p-4 space-y-2">
          <p className="text-xs font-semibold text-orange-700 uppercase tracking-wide">Upcoming in the next 2 weeks</p>
          {upcoming.map(l => {
            const tm = activeTeam.find(m => m.name === l.member);
            return (
              <div key={l.id} className="flex items-center gap-3">
                <div className="w-6 h-6 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0"
                  style={{background: tm?.color||'#6b7280'}}>{tm?.initials||l.member.slice(0,2).toUpperCase()}</div>
                <span className="text-sm font-medium">{l.member}</span>
                <span className="text-xs text-gray-500">{l.start} → {l.end}</span>
                <span className="text-xs font-semibold text-orange-600">{leaveDays(l)}</span>
                <span className="text-xs text-gray-400">{l.type}</span>
              </div>
            );
          })}
        </div>
      )}

      <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table className="w-full text-sm">
          <thead><tr className="bg-gray-50 text-left text-gray-500 text-xs border-b">
            <th className="px-4 py-3">Member</th><th className="px-4 py-3">Type</th>
            <th className="px-4 py-3">From</th><th className="px-4 py-3">To</th>
            <th className="px-4 py-3">Days</th><th className="px-4 py-3">Notes</th>
            <th className="px-4 py-3"></th>
          </tr></thead>
          <tbody>
            {sorted.length === 0 && <tr><td colSpan={7} className="text-center text-gray-400 py-8">No leaves recorded yet.</td></tr>}
            {sorted.map(l => {
              const tm = activeTeam.find(m => m.name === l.member);
              const isPast = l.end && new Date(l.end) < today;
              return (
                <tr key={l.id} className={`border-b last:border-0 hover:bg-gray-50 group ${isPast?'opacity-40':''}`}>
                  <td className="px-4 py-2.5">
                    <div className="flex items-center gap-2">
                      <div className="w-6 h-6 rounded-full flex items-center justify-center text-white text-xs font-bold"
                        style={{background:tm?.color||'#6b7280'}}>{tm?.initials||l.member.slice(0,2).toUpperCase()}</div>
                      <span className="font-medium">{l.member}</span>
                    </div>
                  </td>
                  <td className="px-4 py-2.5"><span className="inline-flex rounded-full px-2 py-0.5 text-xs font-semibold bg-orange-50 text-orange-700">{l.type}</span></td>
                  <td className="px-4 py-2.5 text-gray-500">{l.start}</td>
                  <td className="px-4 py-2.5 text-gray-500">{l.end}</td>
                  <td className="px-4 py-2.5 text-gray-500 font-medium">{leaveDays(l)}</td>
                  <td className="px-4 py-2.5 text-gray-400 max-w-[180px] truncate">{l.notes}</td>
                  <td className="px-4 py-2.5">
                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                      <button onClick={()=>{setForm({...l});setModal(l);}} className="px-2 py-1 text-xs rounded hover:bg-gray-100">✏️</button>
                      <button onClick={()=>dbDelete('leaves',l.id)} className="px-2 py-1 text-xs rounded hover:bg-red-50 text-red-500">🗑</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {modal && (
        <Modal title={modal==='add'?'New leave':'Edit leave'} onClose={()=>setModal(null)}>
          <div className="space-y-3">
            <div><label className="text-xs font-medium text-gray-600">Team member</label>
              <select className={inp+' mt-1'} value={form.member||''} onChange={e=>setForm({...form,member:e.target.value})}>
                {activeTeam.map(m=><option key={m.id} value={m.name}>{m.name}</option>)}
              </select>
            </div>
            <div><label className="text-xs font-medium text-gray-600">Type</label>
              <select className={inp+' mt-1'} value={form.type||'Holiday'} onChange={e=>setForm({...form,type:e.target.value})}>
                {LEAVE_TYPES.map(t=><option key={t}>{t}</option>)}

            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs font-medium text-gray-600">From</label>
                <input type="date" className={inp+' mt-1'} value={form.start||''} onChange={e=>setForm({...form,start:e.target.value})} /></div>
              <div><label className="text-xs font-medium text-gray-600">To</label>
                <input type="date" className={inp+' mt-1'} value={form.end||''} onChange={e=>setForm({...form,end:e.target.value})} /></div>
            </div>
            <div><label className="text-xs font-medium text-gray-600">Notes</label>
              <input className={inp+' mt-1'} placeholder="Optional" value={form.notes||''} onChange={e=>setForm({...form,notes:e.target.value})} /></div>
          </div>
          <div className="flex justify-end gap-2 mt-5">
            <button onClick={()=>setModal(null)} className="px-3 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50">Cancel</button>
            <button onClick={save} className="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">Save</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function Meeting() {
  const { items: missions } = useRTDB('missions');
  const { items: jobs }     = useRTDB('jobs');
  const { items: events }   = useRTDB('events');
  const [index,   setIndex]   = useState(0);
  const [notes,   setNotes]   = useState({});
  const [started, setStarted] = useState(false);
  const [done,    setDone]    = useState(false);

  const today = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  const DISCUSS = ['Not Started','In progress','Pending','Review','GB & SC Review','Sent'];

  // Build agenda: relevant missions + inDealFlow jobs + events
  const agenda = React.useMemo(() => {
    const ms = missions.filter(m => DISCUSS.includes(m.status)).map(m => ({...m, _kind:'mission'}));
    const js = jobs.filter(j => j.inDealFlow && DISCUSS.includes(j.status)).map(j => ({...j, _kind:'job', mission: j.type}));
    const ev = events.map(e => ({...e, _kind:'event'}));
    return [...ms, ...js, ...ev];
  }, [missions, jobs, events]);

  const current = agenda[index];

  const updateStatus   = s  => {
    if (current._kind === 'job') dbUpdate('jobs', current.id, {status: s});
    else dbUpdate('missions', current.id, {status: s});
  };
  const updateComments = c  => {
    if (current._kind === 'job') dbUpdate('jobs', current.id, {comments: c});
    else dbUpdate('missions', current.id, {comments: c});
  };
  const removeEvent    = () => { dbDelete('events', current.id); next(); };

  const next = () => { if(index < agenda.length-1) setIndex(i=>i+1); else setDone(true); };
  const prev = () => { if(index > 0) setIndex(i=>i-1); };

  const kindLabel = k => k==='event' ? '📅 Event' : k==='job' ? '💼 Job (Deal Flow)' : '📁 Mission';
  const kindColor = k => k==='event' ? 'bg-teal-50 text-teal-700' : k==='job' ? 'bg-blue-50 text-blue-700' : 'bg-violet-50 text-violet-700';

  if(!started) return (
    <div className="flex flex-col items-center justify-center min-h-[60vh] text-center space-y-6">
      <div className="space-y-2">
        <h1 className="text-3xl font-bold">Monday Meeting</h1>
        <p className="text-gray-500">{today}</p>
        <p className="text-gray-500 max-w-md">Go through active deals, jobs in pipeline, and upcoming events.</p>
      </div>
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 w-full max-w-sm text-left space-y-3">
        <p className="font-medium text-gray-700">Today's agenda</p>
        {[
          { label:'Deal Flow missions', count: agenda.filter(a=>a._kind==='mission').length, color:'bg-violet-500' },
          { label:'Jobs in pipeline',   count: agenda.filter(a=>a._kind==='job').length,     color:'bg-blue-500' },
          { label:'Events',             count: agenda.filter(a=>a._kind==='event').length,   color:'bg-teal-500' },
        ].map(r=>(
          <div key={r.label} className="flex items-center justify-between text-sm">
            <span className="flex items-center gap-2"><span className={`w-2.5 h-2.5 rounded-full ${r.color}`}/>{r.label}</span>
            <span className="font-bold">{r.count}</span>
          </div>
        ))}
        <div className="pt-1 border-t text-sm font-semibold flex justify-between">
          <span>Total items</span><span>{agenda.length}</span>
        </div>
        {agenda.length===0 && <p className="text-xs text-gray-400 pt-1">Nothing to discuss — add missions, jobs or events first.</p>}
      </div>
      <button onClick={()=>setStarted(true)} disabled={agenda.length===0}
        className="px-8 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-semibold text-base disabled:opacity-40">
        Start meeting →
      </button>
    </div>
  );

  if(done) return (
    <div className="flex flex-col items-center justify-center min-h-[60vh] text-center space-y-6">
      <div className="text-5xl">✅</div>
      <div className="space-y-2">
        <h2 className="text-2xl font-bold">Meeting complete!</h2>
        <p className="text-gray-500">{agenda.length} item{agenda.length!==1?'s':''} reviewed on {today}.</p>
      </div>
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 w-full max-w-sm text-left">
        <p className="font-semibold mb-3">Status summary — missions &amp; jobs</p>
        <div className="space-y-1.5">
          {MISSION_STATUSES.map(s=>{
            const c = [...missions,...jobs.filter(j=>j.inDealFlow)].filter(m=>m.status===s).length;
            return c>0?(<div key={s} className="flex items-center justify-between text-sm"><Badge s={s}/><span className="font-medium">{c}</span></div>):null;
          })}
        </div>
      </div>
      <button onClick={()=>{setStarted(false);setDone(false);setIndex(0);}} className="px-4 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50">← Back to start</button>
    </div>
  );

  if(!current) return <p className="text-gray-400 py-8 text-center">Loading…</p>;

  const kindIcon = k => k==='event'?'📅':k==='job'?'💼':'📁';

  return (
    <div className="flex gap-6 items-start">

      {/* ── Left: step-through panel ── */}
      <div className="flex-1 min-w-0 space-y-6">
        <div className="flex items-center justify-between">

            <div className="space-y-3">

              {current.notes && <p className="text-sm text-gray-600">{current.notes}</p>}

            <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">📝 Meeting note (local only)</p>
            <textarea rows={2} className={inp} value={notes[current.id]||''} onChange={e=>setNotes(n=>({...n,[current.id]:e.target.value}))} placeholder="Internal note for this meeting…" />

        <div className="flex items-center justify-between">
          <button onClick={prev} disabled={index===0} className="px-4 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 disabled:opacity-40">← Previous</button>
          <button onClick={next} className="px-5 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 font-medium">
            {index<agenda.length-1?'Next →':'Finish meeting ✓'}
          </button>
        </div>
      </div>

      {/* ── Right: agenda overview panel ── */}
      <div className="w-72 shrink-0 sticky top-4">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div className="px-4 py-3 border-b bg-gray-50">

            <p className="text-xs text-gray-400 mt-0.5">{agenda.length} item{agenda.length!==1?'s':''} · click to jump</p>
          </div>
          <div className="divide-y divide-gray-100 max-h-[70vh] overflow-y-auto">
            {agenda.map((item, i) => {
              const active = i === index;
              const done   = i < index;
              return (
                <button key={item.id+i} onClick={() => setIndex(i)}
                  className={`w-full text-left px-4 py-3 flex items-start gap-3 transition-colors
                    ${active ? 'bg-blue-600' : done ? 'bg-gray-50 hover:bg-gray-100' : 'hover:bg-blue-50/40'}`}>
                  <span className={`mt-0.5 text-xs font-bold shrink-0 w-5 text-center ${active?'text-white':done?'text-gray-300':'text-gray-400'}`}>
                    {done ? '✓' : active ? '▶' : i+1}
                  </span>
                  <div className="flex-1 min-w-0">
                    <p className={`text-sm font-semibold truncate ${active?'text-white':done?'text-gray-400':'text-gray-700'}`}>
                      {item.client || item.title || '—'}
                    </p>
                    <p className={`text-xs truncate ${active?'text-blue-200':done?'text-gray-300':'text-gray-400'}`}>
                      {kindIcon(item._kind)} {item._kind==='event' ? (item.date||'event') : (item.status||'—')}
                    </p>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      </div>

    </div>
  );
}

// EmailJS config — fill in Settings to activate
const EMAILJS_STORAGE_KEY = 'teamhub_emailjs';
function getEmailJSConfig() {
  try { return JSON.parse(localStorage.getItem(EMAILJS_STORAGE_KEY)||'{}'); } catch { return {}; }
}

function checkAndSendDeadlineEmails(jobs, teamMembers) {
  const cfg = getEmailJSConfig();
  if (!cfg.serviceId || !cfg.templateId || !cfg.publicKey) return;

  const today = new Date(); today.setHours(0,0,0,0);
  const THRESHOLDS = [
    { days:7,  label:'1 week'  },
    { days:4,  label:'4 days'  },
    { days:1,  label:'1 day'   },
  ];

  const sentKey = 'teamhub_notif_sent';
  let sent = {};
  try { sent = JSON.parse(localStorage.getItem(sentKey)||'{}'); } catch {}

  jobs.forEach(job => {
    if (!job.deadline) return;
    const dl = new Date(job.deadline); dl.setHours(0,0,0,0);
    const diffDays = Math.round((dl - today) / 86400000);

    THRESHOLDS.forEach(t => {
      if (diffDays !== t.days) return;
      const key = `${job.id}_${t.days}`;
      if (sent[key]) return; // already sent today

      const workers = (job.workers||[]).join(', ');
      const emails  = teamMembers
        .filter(m => m.active && m.email && (job.workers||[]).includes(m.name))
        .map(m => m.email)
        .join(',');

      if (!emails && !cfg.toEmail) return;

      emailjs.send(cfg.serviceId, cfg.templateId, {
        to_email:    cfg.toEmail || emails,
        project:     job.client,
        deadline:    job.deadline,
        days_left:   t.days,
        days_label:  t.label,
        workers,
        scope:       job.scope || job.methodology || '',
      }, cfg.publicKey)
      .then(() => {
        sent[key] = new Date().toISOString().slice(0,10);
        localStorage.setItem(sentKey, JSON.stringify(sent));
      })
      .catch(err => console.warn('EmailJS error:', err));
    });
  });
}

function NotificationBanner() {
  const { items: jobs } = useRTDB('jobs');
  const [alerts, setAlerts] = useState([]);

  useEffect(() => {
    if (!jobs.length) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const upcoming = [];
    jobs.forEach(j => {
      if (!j.deadline) return;
      const dl = new Date(j.deadline); dl.setHours(0,0,0,0);
      const diff = Math.round((dl - today) / 86400000);
      if (diff === 7 || diff === 4 || diff === 1)
        upcoming.push({ job: j, diff });
      else if (diff === 0)
        upcoming.push({ job: j, diff, today: true });
      else if (diff < 0)
        upcoming.push({ job: j, diff, overdue: true });
    });
    setAlerts(upcoming.sort((a,b) => a.diff - b.diff).slice(0,5));
  }, [jobs]);

  if (!alerts.length) return null;

  return (
    <div className="space-y-2">
      <h2 className="font-semibold">🔔 Deadline alerts</h2>
      {alerts.map(({ job, diff, today: isToday, overdue }) => (
        <div key={job.id} className={`rounded-xl px-4 py-3 text-sm border ${overdue?'bg-red-50 border-red-200':isToday?'bg-orange-50 border-orange-200':'bg-amber-50 border-amber-200'}`}>
          <p className={`font-semibold ${overdue?'text-red-700':isToday?'text-orange-700':'text-amber-700'}`}>
            {overdue ? `⚠️ Overdue by ${Math.abs(diff)}d` : isToday ? '🔴 Due today' : `🔔 Due in ${diff} day${diff>1?'s':''}`}
          </p>
          <p className="text-gray-600 text-xs mt-0.5">
            <strong>{job.client}</strong>{job.workers?.length ? ` — ${job.workers.join(', ')}` : ''}
          </p>
        </div>
      ))}
    </div>
  );
}

function EmailSettings() {
  const [cfg, setCfg] = useState(getEmailJSConfig());
  const [saved, setSaved] = useState(false);
  const [expanded, setExpanded] = useState(false);

  const save = () => {
    localStorage.setItem(EMAILJS_STORAGE_KEY, JSON.stringify(cfg));
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
    if (cfg.publicKey) emailjs.init(cfg.publicKey);
  };

  return (
    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-3">
      <button onClick={() => setExpanded(e=>!e)} className="flex items-center justify-between w-full">
        <div>
          <h2 className="font-semibold text-left">📧 Email notifications</h2>
          <p className="text-xs text-gray-400 text-left mt-0.5">
            {cfg.serviceId ? '✅ Configured — alerts sent at 7d, 4d, 1d before deadline' : 'Not configured — click to set up'}
          </p>
        </div>
        <span className="text-gray-400">{expanded ? '▲' : '▼'}</span>
      </button>

      {expanded && (
        <div className="space-y-3 pt-2 border-t">
          <div className="bg-blue-50 rounded-lg p-3 text-xs text-blue-700 space-y-1">
            <p className="font-semibold">Setup (free, 200 emails/month):</p>
            <p>1. Create account at <strong>emailjs.com</strong></p>
            <p>2. Add an email service (Gmail / Outlook)</p>
            <p>3. Create a template with variables: <code className="bg-blue-100 px-1 rounded">{'{{project}}'}</code>, <code className="bg-blue-100 px-1 rounded">{'{{deadline}}'}</code>, <code className="bg-blue-100 px-1 rounded">{'{{days_label}}'}</code>, <code className="bg-blue-100 px-1 rounded">{'{{workers}}'}</code></p>
            <p>4. Paste your IDs below</p>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs font-medium text-gray-600">Service ID</label>
              <input className={inp+' mt-1'} placeholder="service_xxxxxxx" value={cfg.serviceId||''} onChange={e=>setCfg({...cfg,serviceId:e.target.value})} /></div>
            <div><label className="text-xs font-medium text-gray-600">Template ID</label>
              <input className={inp+' mt-1'} placeholder="template_xxxxxxx" value={cfg.templateId||''} onChange={e=>setCfg({...cfg,templateId:e.target.value})} /></div>
          </div>
          <div><label className="text-xs font-medium text-gray-600">Public Key</label>
            <input className={inp} placeholder="your_public_key" value={cfg.publicKey||''} onChange={e=>setCfg({...cfg,publicKey:e.target.value})} /></div>
          <div><label className="text-xs font-medium text-gray-600">Send alerts to (email)</label>
            <input type="email" className={inp} placeholder="team@example.com" value={cfg.toEmail||''} onChange={e=>setCfg({...cfg,toEmail:e.target.value})} /></div>
          <button onClick={save} className={`px-4 py-2 text-sm rounded-lg font-medium text-white ${saved?'bg-emerald-600':'bg-blue-600 hover:bg-blue-700'}`}>
            {saved ? '✓ Saved' : 'Save email config'}
          </button>
        </div>
      )}
    </div>
  );
}

/* ================================================================
   APP ROOT
   ================================================================ */
function App() {
  const [page, setPage] = useState('dashboard');
  const { items: jobs }        = useRTDB('jobs');
  const { items: teamMembers } = useRTDB('team');

  useEffect(() => {
    dbSeedIfEmpty('team', SEED_TEAM);
  }, []);

  // Init EmailJS and check deadlines once jobs are loaded
  useEffect(() => {
    const cfg = getEmailJSConfig();
    if (cfg.publicKey) emailjs.init(cfg.publicKey);
    if (jobs.length) checkAndSendDeadlineEmails(jobs, teamMembers);
  }, [jobs, teamMembers]);

  // Migration: fix worker names in existing Firebase data
  useEffect(() => {
    const NAME_MAP = { 'Seb': 'Sebastien', 'Alfredo': 'Alfredo Carannante' };
    jobs.forEach(j => {
      const workers = j.workers || [];
      const needsFix = workers.some(w => NAME_MAP[w]);
      if (needsFix) {
        dbUpdate('jobs', j.id, { workers: workers.map(w => NAME_MAP[w] || w) });
      }
    });
  }, [jobs.length]);

  return (
    <div className="flex min-h-screen">
      <Sidebar page={page} setPage={setPage} />
      <main className="ml-52 flex-1 min-h-screen">
        <div className="p-6 max-w-7xl mx-auto">
          {page==='dashboard' && <Dashboard />}
          {page==='dealflow'  && <DealFlow />}
          {page==='planning'  && <AllocationPage />}
          {page==='meeting'   && <Meeting />}
          {page==='settings'  && <Settings />}
        </div>
      </main>
    </div>
  );
}
