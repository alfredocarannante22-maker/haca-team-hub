firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function useRTDB(path) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    const ref = db.ref(path);
    ref.on('value', snap => {
      const val = snap.val();
      setItems(val ? Object.values(val) : []);
      setLoading(false);
    });
    return () => ref.off('value');
  }, [path]);
  return { items, loading };
}
const dbSet    = (path, id, data) => db.ref(`${path}/${id}`).set(data);
const dbUpdate = (path, id, data) => db.ref(`${path}/${id}`).update(data);
const dbDelete = (path, id)       => db.ref(`${path}/${id}`).remove();
const dbSeedIfEmpty = (path, items) =>
  db.ref(path).once('value').then(snap => {
    if (!snap.val()) {
      const obj = {};
      items.forEach(i => { obj[i.id] = i; });
      db.ref(path).set(obj);
    }
  });

function Badge({ s }) {
  return <span className={`inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold ${STATUS_STYLE[s]||'bg-gray-100 text-gray-500'}`}>{s}</span>;
}

function Modal({ title, onClose, children }) {
  useEffect(() => {
    const h = e => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" onClick={e => e.target===e.currentTarget&&onClose()}>
      <div className="relative w-full max-w-2xl rounded-2xl bg-white shadow-2xl">
        <div className="flex items-center justify-between border-b px-6 py-4">
          <h2 className="text-lg font-semibold">{title}</h2>
          <button onClick={onClose} className="rounded-lg p-1 hover:bg-gray-100 text-gray-500">✕</button>
        </div>
        <div className="px-6 py-4 max-h-[80vh] overflow-y-auto">{children}</div>
      </div>
    </div>
  );
}

/* ================================================================
   DASHBOARD
   ================================================================ */
function Dashboard() {
  const { items: missions }    = useRTDB('missions');
  const { items: bizdev }      = useRTDB('bizdev');
  const { items: jobs }        = useRTDB('jobs');
  const { items: leaves }      = useRTDB('leaves');
  const { items: teamMembers } = useRTDB('team');
  const [showHistory, setShowHistory] = useState(false);
  const [showMemberHistory, setShowMemberHistory] = useState(false);

  const activeTeam = useMemo(() => teamMembers.filter(m => m.active), [teamMembers]);

  // Fiscal year: Jul 1 → Jun 30
  const today = useMemo(() => { const d = new Date(); d.setHours(0,0,0,0); return d; }, []);
  const fyStart = useMemo(() => {
    const y = today.getFullYear(), m = today.getMonth();
    return m >= 6 ? new Date(y, 6, 1) : new Date(y-1, 6, 1);
  }, [today]);
  const fyEnd      = useMemo(() => new Date(fyStart.getFullYear()+1, 5, 30), [fyStart]);
  const prevFyStart = useMemo(() => new Date(fyStart.getFullYear()-1, 6, 1), [fyStart]);
  const prevFyEnd   = useMemo(() => new Date(fyStart.getFullYear(), 5, 29), [fyStart]);
  const fyLabel     = `FY${fyEnd.getFullYear()}`;
  const prevFyLabel = `FY${prevFyEnd.getFullYear()}`;

  // Next 2-week window
  const window2M = useMemo(() => { const d = new Date(today); d.setDate(d.getDate()+14); return d; }, [today]);

  // Count Mon-Fri working days in a range
  const workingDays = (s, e) => {
    let n = 0, d = new Date(s);
    while (d <= e) { const w = d.getDay(); if (w && w < 6) n++; d.setDate(d.getDate()+1); }
    return n;
  };
  const totalDays2M = useMemo(() => workingDays(today, window2M), [today, window2M]);

  // FY mission buckets — missions with no deadline count as current FY
  const inRange = (deadline, s, e) => { const d = new Date(deadline); return d >= s && d <= e; };
  const currentFyMissions = useMemo(() =>
    missions.filter(m => !m.deadline || inRange(m.deadline, fyStart, fyEnd)),
    [missions, fyStart, fyEnd]);
  const prevFyMissions = useMemo(() =>
    missions.filter(m => m.deadline && inRange(m.deadline, prevFyStart, prevFyEnd)),
    [missions, prevFyStart, prevFyEnd]);

  // Jobs overlapping the next 2 weeks
  const pipelineJobs = useMemo(() => jobs.filter(j => {
    if (!j.planningStart || !j.planningEnd) return false;
    return new Date(j.planningEnd) >= today && new Date(j.planningStart) <= window2M;
  }), [jobs, today, window2M]);

  // Per-person utilization over next 2 weeks
  const utilization = useMemo(() => activeTeam.map(member => {
    const days = new Set();
    let count = 0;
    jobs.forEach(j => {
      if (!(j.workers||[]).includes(member.name)) return;
      if (!j.planningStart || !j.planningEnd) return;
      const s = new Date(Math.max(new Date(j.planningStart).getTime(), today.getTime()));
      const e = new Date(Math.min(new Date(j.planningEnd).getTime(), window2M.getTime()));
      if (s > e) return;
      count++;
      const d = new Date(s);
      while (d <= e) { const w = d.getDay(); if (w && w < 6) days.add(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
    });
    const pct = totalDays2M > 0 ? Math.round(days.size / totalDays2M * 100) : 0;
    return { ...member, allocated: days.size, pct, projects: count };
  }), [activeTeam, jobs, today, window2M, totalDays2M]);

  // Mission status chart — mirrors Deal Flow (missions + inDealFlow jobs)
  const statusCounts = useMemo(() => {
    const c = {};
    MISSION_STATUSES.forEach(s => { c[s] = 0; });
    missions.forEach(m => { if (m.status) c[m.status] = (c[m.status]||0)+1; });
    jobs.filter(j => j.inDealFlow).forEach(j => { if (j.status) c[j.status] = (c[j.status]||0)+1; });
    return MISSION_STATUSES.map(s => ({s, v: c[s]||0}));
  }, [missions, jobs]);

  // Type breakdown — jobs + missions combined
  const TYPE_HEX = {
    'Valuation - Audit':     '#60a5fa',
    'Valuation - Consulting':'#818cf8',
    'Transaction Services':  '#fbbf24',
    'CFO':                   '#fb7185',
    'Internal Training':     '#4ade80',
    'External Training':     '#2dd4bf',
    'Business Development':  '#fb923c',
  'Other':                 '#9ca3af',
  };
  const typeCounts = useMemo(() => {
    const c = {};
    JOB_TYPES.forEach(t => { c[t] = 0; });
    jobs.forEach(j => { if (j.type) c[j.type] = (c[j.type]||0)+1; });
    missions.forEach(m => { if (m.type && c[m.type] !== undefined) c[m.type] = (c[m.type]||0)+1; });
    return JOB_TYPES.map(t => ({type:t, count:c[t]||0, color:TYPE_HEX[t]||'#9ca3af'})).filter(d=>d.count>0);
  }, [jobs, missions]);

  // Upcoming deadlines (from both missions and jobs sign-off)
  const upcoming = useMemo(() => [
    ...missions.filter(m => m.deadline && new Date(m.deadline) >= today)
               .map(m => ({id:m.id, client:m.client, type:m.mission||'Mission', deadline:m.deadline})),
    ...jobs.filter(j => j.signOff && new Date(j.signOff) >= today)
           .map(j => ({id:'jo'+j.id, client:j.client, type:j.type||'Job', deadline:j.signOff})),
  ].sort((a,b) => a.deadline > b.deadline ? 1 : -1).slice(0,5), [missions, jobs, today]);

  // Upcoming leaves in next 2 weeks
  const upcomingLeaves = useMemo(() => leaves.filter(l =>
    l.start && l.end && new Date(l.end) >= today && new Date(l.start) <= window2M
  ).sort((a,b) => a.start > b.start ? 1 : -1), [leaves, today, window2M]);

  const bizWins  = bizdev.filter(b => b.outcome==='Win').length;
  const bizTotal = bizdev.filter(b => ['Win','Loss','Lost'].includes(b.outcome)).length;
  const winRate  = bizTotal > 0 ? Math.round(bizWins/bizTotal*100) : 0;
  const avgUtil  = utilization.length > 0 ? Math.round(utilization.reduce((s,p) => s+p.pct, 0) / utilization.length) : 0;

  const fmtDate = d => d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});

  const utilColor = pct => pct > 90 ? '#ef4444' : pct > 70 ? '#f59e0b' : '#10b981';

  return (
    <div className="space-y-6">
      <div>
        <h1 className="text-2xl font-bold">Dashboard</h1>
        <p className="text-sm text-gray-500">
          {fyLabel} &mdash; Jul {fyStart.getFullYear()} to Jun {fyEnd.getFullYear()} &nbsp;·&nbsp; {today.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
        </p>
      </div>

      {/* KPI cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[
          { label:`${fyLabel} missions`, value: currentFyMissions.length, bg:'bg-blue-500',    icon:'📁' },
          { label:'Pipeline (2 weeks)',  value: pipelineJobs.length,       bg:'bg-violet-500',  icon:'📅' },
          { label:'Avg utilization',     value:`${avgUtil}%`,              bg:'bg-emerald-500', icon:'⚡' },
          { label:'BD win rate',         value: bizTotal>0?`${winRate}%`:'—', bg:'bg-amber-500', icon:'🏆' },
        ].map(s => (
          <div key={s.label} className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex items-center gap-3">
            <div className={`rounded-xl ${s.bg} text-white text-xl w-12 h-12 flex items-center justify-center shrink-0`}>{s.icon}</div>
            <div>
              <p className="text-2xl font-bold leading-none">{s.value}</p>
              <p className="text-xs text-gray-500 mt-1">{s.label}</p>
            </div>
          </div>
        ))}
      </div>

      {/* Deadline alerts */}
      <NotificationBanner />

      {/* Team utilization */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
        <div className="mb-4">
          <h2 className="font-semibold">Team utilization — next 2 weeks</h2>
          <p className="text-xs text-gray-400 mt-0.5">{fmtDate(today)} → {fmtDate(window2M)} · {totalDays2M} working days available</p>
        </div>
        {activeTeam.length === 0 ? (
          <p className="text-sm text-gray-400">No active team members. Add them in Settings.</p>
        ) : (
          <div className="space-y-3">
            {utilization.map(p => (
              <div key={p.id} className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0"
                  style={{background: p.color||'#6b7280'}}>{p.initials}</div>
                <div className="w-40 shrink-0">
                  <p className="text-sm font-medium truncate">{p.name}</p>
                  <p className="text-xs text-gray-400">{p.projects} project{p.projects!==1?'s':''} &middot; {p.allocated}/{totalDays2M}d allocated</p>
                </div>
                <div className="flex-1 bg-gray-100 rounded-full h-5 overflow-hidden">
                  <div className="h-5 rounded-full transition-all duration-500"
                    style={{width:`${Math.min(p.pct,100)}%`, background: utilColor(p.pct)}} />
                </div>
                <div className="w-11 text-right text-sm font-bold" style={{color: utilColor(p.pct)}}>{p.pct}%</div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Pipeline + Mission status */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <h2 className="font-semibold mb-3">📅 Pipeline — next 2 weeks</h2>
          {pipelineJobs.length === 0 ? (
            <p className="text-sm text-gray-400">No jobs planned in the next 2 weeks. Allocate them in Planning.</p>
          ) : (
            <div className="divide-y divide-gray-50">
              {pipelineJobs.slice(0,8).map(j => (
                <div key={j.id} className="flex items-center gap-2 py-2">
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-medium truncate">{j.client}</p>
                    <p className="text-xs text-gray-400">{j.planningStart} → {j.planningEnd}</p>
                  </div>
                  <div className="flex gap-1 shrink-0">
                    {(j.workers||[]).slice(0,3).map(w => {
                      const tm = teamMembers.find(m => m.name===w);
                      return <span key={w} className="text-xs rounded-full px-2 py-0.5 text-white font-semibold"
                        style={{background: tm?.color||'#6b7280'}}>{tm?.initials||w.slice(0,2).toUpperCase()}</span>;
                    })}
                  </div>
                </div>
              ))}
              {pipelineJobs.length > 8 && <p className="text-xs text-center text-gray-400 pt-2">+{pipelineJobs.length-8} more</p>}
            </div>
          )}
        </div>

        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <h2 className="font-semibold mb-3">📊 Mission status</h2>
          <div className="space-y-1.5">
            {statusCounts.map(({s,v}) => {
              const total = (missions.length + jobs.filter(j=>j.inDealFlow).length) || 1;
              return (
                <div key={s} className="flex items-center gap-3">
                  <div className="w-28 text-xs text-right shrink-0" style={{color: v===0?'#d1d5db':'#6b7280'}}>{s}</div>
                  <div className="flex-1 bg-gray-100 rounded-full h-4 overflow-hidden">
                    {v > 0 && <div className="h-4 rounded-full bg-blue-500 flex items-center justify-end pr-1.5 transition-all"
                      style={{width:`${(v/total)*100}%`}}>
                      <span className="text-white text-[10px] font-bold">{v}</span>
                    </div>}
                  </div>
                  <div className="w-6 text-xs text-gray-400 text-right shrink-0">{v===0?'—':v}</div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* Type breakdown donut */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
        <h2 className="font-semibold mb-4">🍩 Work breakdown by type</h2>
        {typeCounts.length === 0 ? (
          <p className="text-sm text-gray-400">No jobs or missions yet. Add them in Planning or Deal Flow.</p>
        ) : (() => {
          const total = typeCounts.reduce((s,d)=>s+d.count,0);
          const r = 54, cx = 70, cy = 70, circ = 2*Math.PI*r;
          let cum = 0;
          return (
            <div className="flex flex-wrap items-center gap-8">
              <svg width="140" height="140" viewBox="0 0 140 140">
                {typeCounts.map(d => {
                  const pct = d.count/total;
                  const dash = circ*pct;
                  const offset = circ*(1-cum);
                  cum += pct;
                  return (
                    <circle key={d.type} cx={cx} cy={cy} r={r} fill="none"
                      stroke={d.color} strokeWidth="22"
                      strokeDasharray={`${dash} ${circ-dash}`}
                      strokeDashoffset={offset}
                      style={{transform:'rotate(-90deg)',transformOrigin:`${cx}px ${cy}px`}} />
                  );
                })}
                <text x={cx} y={cy-6} textAnchor="middle" fontSize="20" fontWeight="bold" fill="#1f2937">{total}</text>
                <text x={cx} y={cy+12} textAnchor="middle" fontSize="10" fill="#9ca3af">total</text>
              </svg>
              <div className="space-y-2 flex-1 min-w-[180px]">
                {typeCounts.map(d => (
                  <div key={d.type} className="flex items-center gap-2">
                    <span className="w-3 h-3 rounded-full shrink-0" style={{background:d.color}}/>
                    <span className="text-xs text-gray-600 flex-1">{d.type}</span>
                    <span className="text-xs font-bold text-gray-700">{d.count}</span>
                    <span className="text-xs text-gray-400 w-9 text-right">{Math.round(d.count/total*100)}%</span>
                  </div>
                ))}
              </div>
            </div>
          );
        })()}
      </div>

      {/* Upcoming deadlines */}
      {upcoming.length > 0 && (
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <h2 className="font-semibold mb-3">⚠️ Upcoming deadlines</h2>
          <table className="w-full text-sm">
            <thead><tr className="text-left text-gray-500 text-xs border-b">
              <th className="pb-2">Client</th><th className="pb-2">Type</th><th className="pb-2">Deadline</th>
            </tr></thead>
            <tbody>
              {upcoming.map(m => (
                <tr key={m.id} className="border-b last:border-0 hover:bg-gray-50">
                  <td className="py-2 font-medium">{m.client}</td>
                  <td className="py-2 text-gray-500 text-xs">{m.type}</td>
                  <td className="py-2 text-amber-600 font-medium">{m.deadline}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* Upcoming leaves */}
      {upcomingLeaves.length > 0 && (
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <h2 className="font-semibold mb-3">🏖️ Upcoming leaves — next 2 weeks</h2>
          <div className="divide-y divide-gray-50">
            {upcomingLeaves.map(l => {
              const start = new Date(l.start);
              const end = new Date(l.end);
              const days = Math.round((end - start) / 86400000) + 1;
              const tm = teamMembers.find(m => m.name === l.member);
              return (
                <div key={l.id} className="flex items-center gap-3 py-2.5">
                  <div className="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0"
                    style={{background: tm?.color||'#f97316'}}>{tm?.initials||(l.member||'?').slice(0,2).toUpperCase()}</div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-medium">{l.member}</p>
                    <p className="text-xs text-gray-400">
                      {start.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} → {end.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
                      &nbsp;·&nbsp;{days} day{days!==1?'s':''}
                    </p>
                  </div>
                  <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-orange-100 text-orange-700">{l.type||'Leave'}</span>
                  {l.notes && <span className="text-xs text-gray-400 truncate max-w-[120px]" title={l.notes}>{l.notes}</span>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Historicals */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <button onClick={() => setShowHistory(h => !h)} className="flex items-center justify-between w-full">
          <div>
            <h2 className="font-semibold text-left">📦 Historicals — {prevFyLabel}</h2>
            <p className="text-xs text-gray-400 mt-0.5 text-left">
              Jul {prevFyStart.getFullYear()} – Jun {prevFyEnd.getFullYear()} &nbsp;·&nbsp; {prevFyMissions.length} mission{prevFyMissions.length!==1?'s':''}
            </p>
          </div>
          <span className="text-gray-400 text-xs">{showHistory ? '▲' : '▼'}</span>
        </button>
        {showHistory && (
          <div className="mt-3 border-t pt-3">
            {prevFyMissions.length === 0 ? (
              <p className="text-sm text-gray-400">No historical missions for {prevFyLabel}.</p>
            ) : (
              <div className="space-y-1">
                {prevFyMissions.map(m => (
                  <div key={m.id} className="flex items-center gap-3 py-1.5">
                    <span className="text-sm font-medium flex-1">{m.client}</span>
                    <span className="text-xs text-gray-400">{m.deadline||'—'}</span>
                    <Badge s={m.status} />
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      {/* Member project history */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <button onClick={() => setShowMemberHistory(h => !h)} className="flex items-center justify-between w-full">
          <div>
            <h2 className="font-semibold text-left">👤 Member project history</h2>
            <p className="text-xs text-gray-400 mt-0.5 text-left">All missions and jobs each team member has been assigned to</p>
          </div>
          <span className="text-gray-400 text-xs">{showMemberHistory ? '▲' : '▼'}</span>
        </button>
        {showMemberHistory && (
          <div className="mt-3 border-t pt-3 space-y-5">
            {activeTeam.length === 0 && <p className="text-sm text-gray-400">No active team members.</p>}
            {activeTeam.map(member => {
              const mMissions = missions.filter(m => (m.workers||[]).includes(member.name))
                .sort((a,b) => (b.deadline||'') > (a.deadline||'') ? 1 : -1);
              const mJobs = jobs.filter(j => (j.workers||[]).includes(member.name))
                .sort((a,b) => (b.planningStart||'') > (a.planningStart||'') ? 1 : -1);
              const total = mMissions.length + mJobs.length;
              return (
                <div key={member.id}>
                  <div className="flex items-center gap-2 mb-2">
                    <div className="w-7 h-7 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0"
                      style={{background: member.color}}>{member.initials}</div>
                    <span className="font-semibold text-sm">{member.name}</span>
                    <span className="text-xs text-gray-400 bg-gray-100 rounded-full px-2 py-0.5">{total} project{total!==1?'s':''}</span>
                  </div>
                  {total === 0 ? (
                    <p className="text-xs text-gray-400 pl-9">No projects assigned yet.</p>
                  ) : (
                    <div className="pl-9">
                      {mMissions.length > 0 && (
                        <div className="mb-3">
                          <p className="text-[10px] font-semibold text-gray-400 uppercase tracking-wide mb-1">Missions ({mMissions.length})</p>
                          {mMissions.map(m => (
                            <div key={m.id} className="flex items-center gap-2 py-1.5 border-b border-gray-50 last:border-0">
                              <span className="text-sm font-medium flex-1 truncate">{m.client}</span>
                              <span className="text-xs text-gray-400">{m.mission||'—'}</span>
                              {m.deadline && <span className="text-xs text-gray-400 shrink-0">{m.deadline}</span>}
                              <Badge s={m.status} />
                            </div>
                          ))}
                        </div>
                      )}
                      {mJobs.length > 0 && (
                        <div>
                          <p className="text-[10px] font-semibold text-gray-400 uppercase tracking-wide mb-1">Jobs ({mJobs.length})</p>
                          {mJobs.map(j => (
                            <div key={j.id} className="flex items-center gap-2 py-1.5 border-b border-gray-50 last:border-0">
                              <span className="text-sm font-medium flex-1 truncate">{j.client}</span>
                              <span className="text-xs text-gray-400">{j.type||'—'}</span>
                              {j.planningStart && <span className="text-xs text-gray-400 shrink-0">{j.planningStart} → {j.planningEnd}</span>}
                              <Badge s={j.status} />
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ================================================================
   DEAL FLOW
   ================================================================ */
const MISSION_STATUSES = ['Not Started','In progress','Pending','Review','GB & SC Review','Sent'];

function WorkerPicker({ value, onChange }) {
  const { items: teamMembers } = useRTDB('team');
  const active = teamMembers.filter(m => m.active);
  const selected = Array.isArray(value) ? value : [];
  const toggle = name => onChange(selected.includes(name) ? selected.filter(n=>n!==name) : [...selected, name]);
  return (
    <div className="flex flex-wrap gap-2 mt-1 min-h-[36px]">
      {active.length === 0 && <p className="text-xs text-gray-400 self-center">No active members — add them in Settings.</p>}
      {active.map(m => {
        const on = selected.includes(m.name);
        return (
          <button key={m.id} type="button" onClick={() => toggle(m.name)}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border-2 transition-all ${on ? 'text-white' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-400'}`}
            style={on ? {background: m.color||'#6b7280', borderColor: m.color||'#6b7280'} : {}}>
            <span className="w-4 h-4 rounded-full flex items-center justify-center text-white text-xs shrink-0"
              style={{background: m.color||'#6b7280'}}>{m.initials}</span>
            {m.name}
          </button>
        );
      })}
    </div>
  );
}

function MissionRow({ m, inlineStatus, openEdit, done }) {
  return (
    <tr className={`border-b last:border-0 hover:bg-gray-50 group ${done?'opacity-60':''}`}>
      <td className="px-4 py-2.5 font-medium whitespace-nowrap">{m.client}</td>
      <td className="px-4 py-2.5">
        <div className="flex flex-wrap gap-1">
          {(m.workers||[]).map(w=><span key={w} className="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold bg-blue-50 text-blue-700">{w}</span>)}
        </div>
      </td>
      <td className="px-4 py-2.5 text-gray-600 max-w-[220px]">
        <div className="flex flex-wrap gap-1 items-center">
          {m._isJob && <span className="inline-flex items-center rounded-full px-1.5 py-0.5 text-xs font-semibold bg-violet-100 text-violet-700">Job</span>}
          {(m.type||m.mission) && <span className={`inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold ${JOB_TYPE_STYLE(m.type||'')}`}>{m.type||m.mission}</span>}
          {m.type && m.mission && <span className="text-xs text-gray-500 truncate">{m.mission}</span>}
        </div>
      </td>
      <td className="px-4 py-2.5">
        <select value={m.status} onChange={e=>inlineStatus(m,e.target.value)}
          className="text-xs rounded-full border border-gray-200 px-2 py-1 bg-white cursor-pointer">
          {MISSION_STATUSES.map(s=><option key={s}>{s}</option>)}
        </select>
      </td>
      <td className="px-4 py-2.5 text-gray-500 max-w-[220px]"><span className="line-clamp-2">{m.comments}</span></td>
      <td className="px-4 py-2.5 text-gray-500 whitespace-nowrap text-xs">{m.deadline}</td>
      <td className="px-4 py-2.5">
        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
          {!m._isJob && <button onClick={()=>openEdit(m)} className="px-2 py-1 text-xs rounded hover:bg-gray-100">✏️</button>}
          {!m._isJob && <button onClick={()=>dbDelete('missions',m.id)} className="px-2 py-1 text-xs rounded hover:bg-red-50 text-red-500">🗑</button>}
          {m._isJob  && <span className="px-2 py-1 text-xs text-gray-400 italic">from Planning</span>}
        </div>
      </td>
    </tr>
  );
}

function MissionsTab() {
  const { items: missions, loading } = useRTDB('missions');
  const { items: jobs }              = useRTDB('jobs');
  const [search,  setSearch]  = useState('');
  const [filter,  setFilter]  = useState('All');
  const [modal,   setModal]   = useState(null);
  const [form,    setForm]    = useState({});

  // Jobs linked to Deal Flow, mapped to a mission-like shape
  const linkedJobs = jobs.filter(j => j.inDealFlow).map(j => ({
    _isJob:   true,
    id:       j.id,
    client:   j.client,
    workers:  j.workers || [],
    mission:  j.type || '',
    status:   j.status || 'Not Started',
    comments: j.comments || '',
    deadline: j.signOff || '',
  }));

  // Merge missions + linked jobs, then apply filters
  const DONE_STATUSES = ['Sent', 'Lost'];
  const STATUS_ORDER  = ['In progress','Pending','GB & SC Review','Review','Not Started','Sent','Lost'];
  const sortByStatus  = arr => [...arr].sort((a,b) => (STATUS_ORDER.indexOf(a.status)||99) - (STATUS_ORDER.indexOf(b.status)||99));
  const allItems = [...missions, ...linkedJobs];
  const filtered = allItems.filter(m => {
    const ok1 = !search || m.client.toLowerCase().includes(search.toLowerCase()) || (m.workers||[]).join(' ').toLowerCase().includes(search.toLowerCase());
    const ok2 = filter==='All' || m.status===filter;
    return ok1 && ok2;
  });
  const activeItems = sortByStatus(filtered.filter(m => !DONE_STATUSES.includes(m.status)));
  const doneItems   = sortByStatus(filtered.filter(m =>  DONE_STATUSES.includes(m.status)));

  const openAdd  = () => { setForm({client:'',workers:[],type:'',mission:'',status:'Not Started',comments:'',deadline:''}); setModal('add'); };
  const openEdit = m  => { setForm({...m}); setModal(m); };

  const save = () => {
    const item = { ...form, workers: Array.isArray(form.workers) ? form.workers : [] };
    if (modal==='add') { const id=`m${Date.now()}`; dbSet('missions',id,{id,...item}); }
    else { dbUpdate('missions', modal.id, item); }
    setModal(null);
  };

  const inlineStatus = (m, status) => {
    if (m._isJob) dbUpdate('jobs', m.id, {status});
    else          dbUpdate('missions', m.id, {status});
  };

  if(loading) return <p className="text-gray-400 py-8 text-center">Loading…</p>;

  return (
    <div className="space-y-3">
      <div className="flex flex-wrap items-center gap-3">
        <input className={inp+' max-w-xs'} placeholder="Search client or worker…" value={search} onChange={e=>setSearch(e.target.value)} />
        <select className={inp+' w-40'} value={filter} onChange={e=>setFilter(e.target.value)}>
          <option value="All">All statuses</option>
          {MISSION_STATUSES.map(s=><option key={s}>{s}</option>)}
        </select>
        <button onClick={openAdd} className="ml-auto px-3 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 font-medium">+ Add mission</button>
      </div>

      <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm min-w-[700px]">
            <thead><tr className="bg-gray-50 text-left text-gray-500 text-xs border-b">
              <th className="px-4 py-3">Client</th>
              <th className="px-4 py-3">Workers</th>
              <th className="px-4 py-3">Mission</th>
              <th className="px-4 py-3">Status</th>
              <th className="px-4 py-3">Comments</th>
              <th className="px-4 py-3">Deadline</th>
              <th className="px-4 py-3"></th>
            </tr></thead>
            <tbody>
              {activeItems.map(m => <MissionRow key={m.id} m={m} inlineStatus={inlineStatus} openEdit={openEdit} />)}
              {doneItems.length > 0 && (
                <>
                  <tr><td colSpan={7} className="px-4 py-2 bg-gray-50 border-y border-gray-200">
                    <span className="text-xs font-semibold text-gray-400 uppercase tracking-wide">✓ Sent / Closed — {doneItems.length}</span>
                  </td></tr>
                  {doneItems.map(m => <MissionRow key={m.id} m={m} inlineStatus={inlineStatus} openEdit={openEdit} done />)}
                </>
              )}
            </tbody>
          </table>
        </div>
        {filtered.length===0&&<p className="text-center text-gray-400 py-8">No missions match your filters.</p>}
      </div>

      {modal&&(
        <Modal title={modal==='add'?'New mission':`Edit — ${modal.client||''}`} onClose={()=>setModal(null)}>
          <div className="space-y-3">
            <div><label className="text-xs font-medium text-gray-600">Client</label>
              <input className={inp+' mt-1'} value={form.client||''} onChange={e=>setForm({...form,client:e.target.value})} /></div>
            <div>
              <label className="text-xs font-medium text-gray-600">Workers</label>
              <WorkerPicker value={form.workers||[]} onChange={v=>setForm({...form,workers:v})} />
            </div>
            <div><label className="text-xs font-medium text-gray-600">Type</label>
              <select className={inp+' mt-1'} value={form.type||''} onChange={e=>setForm({...form,type:e.target.value})}>
                <option value="">— select type —</option>
                {JOB_TYPES.map(t=><option key={t}>{t}</option>)}
              </select></div>
            <div><label className="text-xs font-medium text-gray-600">Mission / scope</label>
              <input className={inp+' mt-1'} value={form.mission||''} onChange={e=>setForm({...form,mission:e.target.value})} /></div>
            <div className="grid grid-cols-2 gap-3">

const JOB_TYPE_STYLE = t =>
  t.startsWith('Valuation')          ? 'bg-blue-50 text-blue-700' :
  t === 'Transaction Services'       ? 'bg-amber-50 text-amber-700' :
  t === 'CFO'                        ? 'bg-rose-50 text-rose-700' :
  t.includes('Training')             ? 'bg-green-50 text-green-700' :
  t === 'Business Development'       ? 'bg-orange-50 text-orange-700' :
  'bg-gray-50 text-gray-700';
const TYPE_COLORS  = {
  'Valuation - Audit':     'bg-blue-400',
  'Valuation - Consulting':'bg-indigo-400',
  'Transaction Services':  'bg-amber-400',
  'CFO':                   'bg-rose-400',
  'Internal Training':     'bg-green-400',
  'External Training':     'bg-teal-400',
  'Business Development':  'bg-orange-400',
  'Other':                 'bg-gray-400',
};

function JobsTable() {
  const { items, loading } = useRTDB('jobs');
  const { items: leaves }  = useRTDB('leaves');
  const [typeFilter, setTypeFilter] = useState('All');
  const [modal, setModal] = useState(null);
  const [form,  setForm]  = useState({});
  const [menuOpen, setMenuOpen] = useState(null);

  const JOB_DONE    = ['Sent','Lost'];
  const JOB_S_ORDER = ['In progress','Pending','GB Review','Not Started','Sent','Lost'];
  const sortJobs    = arr => [...arr].sort((a,b) => (JOB_S_ORDER.indexOf(a.status)||99) - (JOB_S_ORDER.indexOf(b.status)||99));
  const all = typeFilter==='All'?items:items.filter(j=>j.type===typeFilter);
  const filtered      = sortJobs(all.filter(j => !JOB_DONE.includes(j.status)));
  const filteredDone  = sortJobs(all.filter(j =>  JOB_DONE.includes(j.status)));

  const openAdd  = () => setForm({client:'',workers:[],status:'Not Started',type:typeFilter==='All'?'Valuation':typeFilter,numDays:'',effortUnit:'days',signOff:'',planningStart:'',planningEnd:'',assets:'',methodology:'',scope:''});
  const openEdit = j  => { setForm({...j}); setModal(j); };

  const save = () => {
    const item = { ...form, workers: Array.isArray(form.workers) ? form.workers : [] };
    const conflicts = checkLeaveConflicts(item.workers, item.planningStart, item.planningEnd, leaves);
    if (!confirmLeaveConflicts(conflicts)) return;
    if (!modal||modal==='add') { const id=`j${Date.now()}`; dbSet('jobs',id,{id,...item}); }
    else { dbUpdate('jobs',modal.id,item); }
    setModal(null);
  };

  if(loading) return <p className="text-gray-400 py-8 text-center">Loading…</p>;

  return (
    <div className="space-y-3">
      <div className="flex items-center gap-3">
        {['All',...JOB_TYPES].map(t=>(
          <button key={t} onClick={()=>setTypeFilter(t)}

        ))}

      </div>
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div className="overflow-x-auto">

                if (j._separator) return (

                    <span className="text-xs font-semibold text-gray-400 uppercase tracking-wide">✓ Sent / Closed — {filteredDone.length}</span>

                return (

function GanttChart() {
  const { items }         = useRTDB('jobs');
  const { items: leaves } = useRTDB('leaves');
  const [monthOffset, setMonthOffset] = useState(new Date().getMonth());
  const [modal, setModal]             = useState(null);
  const [form,  setForm]              = useState({});
  const [draggingJobId, setDraggingJobId] = useState(null);
  const [pendingDrag, setPendingDrag]     = useState(null);
  const dragInfoRef = useRef(null);

  const base = new Date(2026, monthOffset, 1);
  const year = base.getFullYear();
  const month = base.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const days = Array.from({length:daysInMonth},(_,i)=>i+1);
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const jobsWithDates = items.filter(j=>j.planningStart&&j.planningEnd);

  const isWeekend = day => [0,6].includes(new Date(year,month,day).getDay());
  const isToday   = day => { const t=new Date(); return t.getFullYear()===year&&t.getMonth()===month&&t.getDate()===day; };

  const inRange = (job, day) => {
    const d = new Date(year, month, day);
    const s = new Date(job.planningStart);
    const e = new Date(job.planningEnd);
    s.setHours(0,0,0,0); e.setHours(23,59,59,999);
    return d>=s && d<=e;
  };
  const isStartDay = (job, day) => {
    const s = new Date(job.planningStart);
    return s.getFullYear()===year && s.getMonth()===month && s.getDate()===day;
  };
  const isEndDay = (job, day) => {
    const e = new Date(job.planningEnd);
    return e.getFullYear()===year && e.getMonth()===month && e.getDate()===day;
  };

  const addDaysStr = (dateStr, n) => {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  };

  const openAdd = () => {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-01`;
    setForm({client:'', workers:[], status:'Not Started', type:'Valuation - Audit', numDays:'', effortUnit:'days', signOff:'', planningStart:dateStr, planningEnd:dateStr, assets:'', methodology:'', scope:''});
    setModal('add');
  };
  const openEdit = j => { setForm({...j}); setModal(j); };

  const save = () => {
    const item = { ...form, workers: Array.isArray(form.workers) ? form.workers : [] };
    const conflicts = checkLeaveConflicts(item.workers, item.planningStart, item.planningEnd, leaves);
    if (!confirmLeaveConflicts(conflicts)) return;
    if (!modal || modal === 'add') { const id=`j${Date.now()}`; dbSet('jobs',id,{id,...item}); }
    else { dbUpdate('jobs', modal.id, item); }
    setModal(null);
  };

  const handleJobDragStart = (e, job, day) => {
    dragInfoRef.current = { jobId: job.id, originDay: day };
    setDraggingJobId(job.id);
    e.dataTransfer.effectAllowed = 'move';
  };
  const handleJobDragEnd = () => { setDraggingJobId(null); dragInfoRef.current = null; };

  const handleDropOnCell = (e, targetDay) => {
    e.preventDefault();
    const di = dragInfoRef.current;
    if (!di) return;
    const job = jobsWithDates.find(j => j.id === di.jobId);
    dragInfoRef.current = null;
    setDraggingJobId(null);
    if (!job) return;
    const delta = targetDay - di.originDay;
    if (delta === 0) return;
    const newStart = addDaysStr(job.planningStart, delta);
    const newEnd   = addDaysStr(job.planningEnd, delta);
    const conflicts = checkLeaveConflicts(job.workers, newStart, newEnd, leaves);
    if (conflicts.length > 0) {
      setPendingDrag({ job, newStart, newEnd, conflicts });
    } else {
      dbUpdate('jobs', job.id, { planningStart: newStart, planningEnd: newEnd });
    }
  };

  return (
    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <div className="flex items-center justify-between px-4 py-3 border-b bg-gray-50">
        <button onClick={()=>setMonthOffset(o=>o-1)} className="px-3 py-1.5 text-sm rounded-lg hover:bg-gray-200">← Prev</button>
        <span className="font-semibold">{MONTHS[month]} {year}</span>
        <div className="flex items-center gap-2">
          <button onClick={openAdd} className="px-3 py-1.5 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">+ Add job</button>
          <button onClick={()=>setMonthOffset(o=>o+1)} className="px-3 py-1.5 text-sm rounded-lg hover:bg-gray-200">Next →</button>
        </div>
      </div>
      <div className="overflow-x-auto">
        <div style={{minWidth: Math.max(900, daysInMonth*30+180)+'px'}}>
          <div className="flex border-b bg-gray-50">
            <div className="w-44 shrink-0 border-r px-3 py-2 text-xs font-medium text-gray-500">Client</div>
            {days.map(d=>(
              <div key={d} style={{minWidth:28}} className={`flex-1 text-center border-r last:border-0 py-1.5 ${isToday(d)?'bg-blue-50':isWeekend(d)?'bg-gray-50/60':''}`}>
                <div className={`text-xs font-medium ${isToday(d)?'text-blue-600':isWeekend(d)?'text-gray-300':'text-gray-400'}`}>{d}</div>
                <div className="text-[9px] text-gray-300">{['S','M','T','W','T','F','S'][new Date(year,month,d).getDay()]}</div>
              </div>
            ))}
          </div>
          {jobsWithDates.map(j=>(
            <div key={j.id} className={`flex border-b last:border-0 hover:bg-gray-50 group ${draggingJobId===j.id?'opacity-50':''}`} style={{height:36}}>
              <div className="w-44 shrink-0 border-r px-3 flex items-center gap-1.5">
                <span className="text-xs font-medium text-gray-700 truncate flex-1">{j.client}</span>
                <button onClick={()=>openEdit(j)} title="Edit job"
                  className="opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-blue-600 text-xs shrink-0">✏️</button>
              </div>
              {days.map(d=>{
                const active = inRange(j,d);
                const start  = isStartDay(j,d);
                const end    = isEndDay(j,d);
                const wknd   = isWeekend(d);
                return (
                  <div key={d} style={{minWidth:28}}
                    onDragOver={e => e.preventDefault()}
                    onDrop={e => handleDropOnCell(e, d)}
                    className={`flex-1 border-r last:border-0 flex items-center px-0.5 ${isToday(d)?'bg-blue-50/40':wknd?'bg-gray-50':''}`}>
                    {active && (
                      <div
                        draggable={!wknd}
                        onDragStart={e => !wknd && handleJobDragStart(e, j, d)}
                        onDragEnd={handleJobDragEnd}
                        title={`${j.client} — ${(j.workers||[]).join(', ')}\n${j.planningStart} → ${j.planningEnd}\nDrag to shift dates`}
                        className={`h-5 w-full ${TYPE_COLORS[j.type]||'bg-blue-400'} ${wknd?'opacity-20':'opacity-80 cursor-grab active:cursor-grabbing'} ${start?'rounded-l-full':''} ${end?'rounded-r-full':''}`} />
                    )}
                  </div>
                );
              })}
            </div>
          ))}
          {jobsWithDates.length===0&&(
            <p className="text-center text-gray-400 py-8 text-sm">No jobs with planning dates. Click <strong>+ Add job</strong> to create one.</p>
          )}
        </div>
      </div>
      <div className="flex items-center justify-between gap-4 px-4 py-2 border-t">
        <div className="flex flex-wrap gap-3 text-xs text-gray-500">
          {JOB_TYPES.map(t=>(
            <span key={t} className="flex items-center gap-1.5">
              <span className={`inline-block w-3 h-3 rounded-full ${TYPE_COLORS[t]}`}/>{t}
            </span>
          ))}
        </div>
        <p className="text-xs text-gray-400 shrink-0">💡 Drag a bar to shift dates · ✏️ to edit</p>
      </div>

      {modal&&(
        <Modal title={modal==='add'?'New job':`Edit — ${modal.client||''}`} onClose={()=>setModal(null)}>
          <div className="space-y-3">
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs font-medium text-gray-600">Client</label>
                <input className={inp+' mt-1'} value={form.client||''} onChange={e=>setForm({...form,client:e.target.value})} /></div>
              <div><label className="text-xs font-medium text-gray-600">Type</label>
                <select className={inp+' mt-1'} value={form.type||'Valuation - Audit'} onChange={e=>setForm({...form,type:e.target.value})}>
                  {JOB_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
            </div>
            <div><label className="text-xs font-medium text-gray-600">Workers</label>
              <WorkerPicker value={form.workers||[]} onChange={v=>setForm({...form,workers:v})} /></div>
            <div><label className="text-xs font-medium text-gray-600">Sign-off</label>
              <input type="date" className={inp+' mt-1'} value={form.signOff||''} onChange={e=>setForm({...form,signOff:e.target.value})} /></div>
            <div className="grid grid-cols-3 gap-3">
              <div><label className="text-xs font-medium text-gray-600">Assets</label>
                <input className={inp+' mt-1'} value={form.assets||''} onChange={e=>setForm({...form,assets:e.target.value})} /></div>
              <div><label className="text-xs font-medium text-gray-600">Methodology</label>
                <input className={inp+' mt-1'} value={form.methodology||''} onChange={e=>setForm({...form,methodology:e.target.value})} /></div>
              <div><label className="text-xs font-medium text-gray-600">Effort</label>
                <div className="flex gap-1 mt-1">
                  <input type="number" min="0" step="0.5" className={inp+' flex-1'} value={form.numDays||''} onChange={e=>setForm({...form,numDays:e.target.value})} />
                  <select className={inp+' w-24 shrink-0'} value={form.effortUnit||'days'} onChange={e=>setForm({...form,effortUnit:e.target.value})}>
                    <option value="days">days</option><option value="hours">hours</option>
                  </select>
                </div>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs font-medium text-gray-600">Planning start</label>
                <input type="date" className={inp+' mt-1'} value={form.planningStart||''} onChange={e=>setForm({...form,planningStart:e.target.value})} /></div>
              <div><label className="text-xs font-medium text-gray-600">Planning end</label>
                <input type="date" className={inp+' mt-1'} value={form.planningEnd||''} onChange={e=>setForm({...form,planningEnd:e.target.value})} /></div>
            </div>
            <div><label className="text-xs font-medium text-gray-600">Scope / notes</label>
              <textarea rows={2} className={inp+' mt-1'} value={form.scope||''} onChange={e=>setForm({...form,scope:e.target.value})} /></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs font-medium text-gray-600">Status</label>
                <select className={inp+' mt-1'} value={form.status||'Not Started'} onChange={e=>setForm({...form,status:e.target.value})}>
                  {JOB_STATUSES.map(s=><option key={s}>{s}</option>)}</select></div>
              <div><label className="text-xs font-medium text-gray-600">Deadline 🔔</label>
                <input type="date" className={inp+' mt-1'} value={form.deadline||''} onChange={e=>setForm({...form,deadline:e.target.value})} /></div>

          </div>
          <div className="flex justify-end gap-2 mt-5">
            <button onClick={()=>setModal(null)} className="px-3 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50">Cancel</button>

      {pendingDrag && (
        <Modal title="⚠️ Leave conflict" onClose={() => setPendingDrag(null)}>

const PROJECT_COLORS = ['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ef4444','#6366f1','#14b8a6','#f97316','#ec4899','#06b6d4','#84cc16','#a855f7'];
const GANTT_BLOCK_COLORS = ['#6366f1','#f59e0b','#10b981','#ef4444','#ec4899','#06b6d4'];

function checkLeaveConflicts(workers, planningStart, planningEnd, leaves) {
  if (!planningStart || !planningEnd || !workers?.length) return [];
  const s = new Date(planningStart); s.setHours(0,0,0,0);
  const e = new Date(planningEnd);   e.setHours(23,59,59,999);
  const conflicts = [];
  (workers || []).forEach(name => {
    leaves.filter(l => l.member === name && l.start && l.end).forEach(l => {
      const ls = new Date(l.start); ls.setHours(0,0,0,0);
      const le = new Date(l.end);   le.setHours(23,59,59,999);
      if (s <= le && e >= ls) conflicts.push({ worker: name, start: l.start, end: l.end, type: l.type || 'Leave' });
    });
  });
  return conflicts;
}

function confirmLeaveConflicts(conflicts) {
  if (!conflicts.length) return true;
  const lines = conflicts.map(c => `• ${c.worker}: on leave ${c.start} → ${c.end} (${c.type})`).join('\n');
  return window.confirm(`⚠️ Leave conflict detected:\n\n${lines}\n\nThis person is on leave during the planned period.\nDo you want to plan them anyway?`);
}

function TeamGantt() {
  const { items:jobs }        = useRTDB('jobs');
  const { items:teamMembers } = useRTDB('team');
  const [monthOffset, setMonthOffset] = useState(new Date().getMonth());

  const base = new Date(2026, monthOffset, 1);
  const year = base.getFullYear();
  const month = base.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const days = Array.from({length:daysInMonth},(_,i)=>i+1);
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const jobsWithDates = jobs.filter(j=>j.planningStart&&j.planningEnd);

  // All unique workers from jobs + team members list
  const allWorkers = useMemo(()=>{
    const set = new Set();
    jobsWithDates.forEach(j=>(j.workers||[]).forEach(w=>w&&set.add(w)));
    teamMembers.forEach(m=>{ if(m.name) set.add(m.name); });
    return [...set].sort();
  },[jobsWithDates, teamMembers]);

  // Stable color per client
  const clientColorMap = useMemo(()=>{
    const clients = [...new Set(jobsWithDates.map(j=>j.client))];
    const map = {};
    clients.forEach((c,i)=>{ map[c]=PROJECT_COLORS[i%PROJECT_COLORS.length]; });
    return map;
  },[jobsWithDates]);

  const inRange = (job, day) => {
    const d = new Date(year, month, day);
    const s = new Date(job.planningStart); s.setHours(0,0,0,0);
    const e = new Date(job.planningEnd);   e.setHours(23,59,59,999);
    return d>=s && d<=e;
  };

  const isToday = (day) => {
    const t = new Date();
    return t.getFullYear()===year && t.getMonth()===month && t.getDate()===day;
  };

  const workerJobs = (worker) => jobsWithDates.filter(j=>(j.workers||[]).includes(worker));

  return (
    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <div className="flex items-center justify-between px-4 py-3 border-b bg-gray-50">
        <button onClick={()=>setMonthOffset(o=>o-1)} className="px-3 py-1.5 text-sm rounded-lg hover:bg-gray-200">← Prev</button>
        <span className="font-semibold text-gray-800">{MONTHS[month]} {year}</span>
        <button onClick={()=>setMonthOffset(o=>o+1)} className="px-3 py-1.5 text-sm rounded-lg hover:bg-gray-200">Next →</button>
      </div>

      <div className="overflow-x-auto">
        <div style={{minWidth: Math.max(900, daysInMonth*36+200)+'px'}}>
          {/* Day headers */}
          <div className="flex border-b bg-gray-50 sticky top-0 z-10">
            <div className="w-48 shrink-0 border-r px-3 py-2 text-xs font-semibold text-gray-500 uppercase tracking-wide">Member</div>
            {days.map(d=>(
              <div key={d} style={{minWidth:36}} className={`flex-1 text-center border-r last:border-0 py-2 ${isToday(d)?'bg-blue-50':''}`}>
                <div className={`text-xs font-semibold ${isToday(d)?'text-blue-600':'text-gray-400'}`}>{d}</div>
                <div className="text-gray-300 text-xs">{['Su','Mo','Tu','We','Th','Fr','Sa'][new Date(year,month,d).getDay()]}</div>
              </div>
            ))}
          </div>

          {/* One row per team member */}
          {allWorkers.map(worker=>{
            const wJobs = workerJobs(worker);
            const hasActivity = wJobs.length > 0;
            return (
              <div key={worker} className={`flex border-b last:border-0 ${hasActivity?'hover:bg-blue-50/30':''}`} style={{minHeight:48}}>
                <div className="w-48 shrink-0 border-r px-3 flex items-center gap-2">
                  <div className="w-7 h-7 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0"
                    style={{background: teamMembers.find(m=>m.name===worker)?.color || '#6b7280'}}>
                    {worker.slice(0,2).toUpperCase()}
                  </div>
                  <span className="text-sm font-medium text-gray-700 truncate">{worker}</span>
                </div>
                <div className="flex flex-1">
                  {days.map(d=>{
                    const isWknd = [0,6].includes(new Date(year,month,d).getDay());
                    const activeJobs = isWknd ? [] : wJobs.filter(j=>inRange(j,d));
                    return (
                      <div key={d} style={{minWidth:36}}
                        className={`flex-1 border-r last:border-0 flex flex-col gap-0.5 py-1 px-0.5 ${isToday(d)?'bg-blue-50/60':isWknd?'bg-gray-50':''}`}>
                        {activeJobs.map(j=>(
                          <div key={j.id}
                            title={`${j.client}${j.numDays?' — '+j.numDays+(j.effortUnit==='hours'?'h':'d'):''}\n${j.planningStart} → ${j.planningEnd}`}
                            className="h-5 rounded text-white text-[9px] font-semibold flex items-center px-1 overflow-hidden cursor-default select-none"
                            style={{background: clientColorMap[j.client]||'#3b82f6', opacity:0.9}}>
                            {j.client.length>6?j.client.slice(0,6)+'…':j.client}
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {allWorkers.length===0&&(
            <p className="text-center text-gray-400 py-10 text-sm">No team members with planned jobs this month.</p>
          )}
        </div>
      </div>

      {/* Client legend */}
      {Object.keys(clientColorMap).length>0&&(
        <div className="px-4 py-3 border-t bg-gray-50">
          <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Projects</p>
          <div className="flex flex-wrap gap-3">
            {Object.entries(clientColorMap).map(([client,color])=>(
              <span key={client} className="flex items-center gap-1.5 text-xs text-gray-600">
                <span className="inline-block w-3 h-3 rounded" style={{background:color}}/>{client}
              </span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
